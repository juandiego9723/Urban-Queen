<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Universal Overlay — TikDance</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            background: transparent;
            overflow: hidden;
        }
        #content-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <iframe id="content-frame" src="about:blank"></iframe>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let userParam = urlParams.get('user') || '';

        // Si no hay parámetro de usuario en la URL, consultar /api/me para obtener el usuario activo
        if (!userParam) {
            fetch('/api/me').then(r => r.json()).then(d => {
                if (d && d.username) {
                    userParam = d.username;
                    if (frame.src && frame.src !== 'about:blank' && !frame.src.includes('user=')) {
                        const connector = frame.src.includes('?') ? '&' : '?';
                        frame.src += `${connector}user=${userParam}`;
                    }
                }
            }).catch(() => {});
        }

        // Conectar a Socket.io pasando el usuario si existe
        const socket = io({ query: userParam ? { user: userParam } : {} });

        const frame = document.getElementById('content-frame');
        let ultimaVista = '';

        socket.on('cambioVista', (vista) => {
            if (!vista) return;
            if (vista === ultimaVista) return;
            ultimaVista = vista;

            // Construir URL del iframe y propagar el usuario
            let targetUrl = vista;
            if (userParam) {
                const connector = targetUrl.includes('?') ? '&' : '?';
                targetUrl += `${connector}user=${userParam}`;
            }
            frame.src = targetUrl;
        });
    </script>
</body>
</html>
