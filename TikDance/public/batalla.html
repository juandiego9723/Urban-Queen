<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Inyección de multi-cuenta -->
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const user = urlParams.get('user');
            if (user) {
                const originalFetch = window.fetch;
                window.fetch = function(url, options) {
                    if (typeof url === 'string' && !url.includes('user=')) {
                        const sep = url.includes('?') ? '&' : '?';
                        url = url + sep + 'user=' + encodeURIComponent(user);
                    }
                    return originalFetch(url, options);
                };
                const originalIo = window.io;
                if (originalIo) {
                    window.io = function(opts) {
                        opts = opts || {};
                        opts.query = opts.query || {};
                        opts.query.user = user;
                        return originalIo(opts);
                    };
                } else {
                    let _io = undefined;
                    Object.defineProperty(window, 'io', {
                        get: function() { return _io; },
                        set: function(val) {
                            _io = function(opts) {
                                opts = opts || {};
                                opts.query = opts.query || {};
                                opts.query.user = user;
                                return val(opts);
                            };
                        },
                        configurable: true
                    });
                }
            }
        })();
    </script>

    <meta charset="UTF-8">
    <title>Modo Batalla TikDance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@700;800;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #00FF00; /* Fondo chroma verde para OBS */
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 22px;
        }

        /* Configuración de brillo neón global */
        body.neon-none * {
            text-shadow: none !important;
            box-shadow: none !important;
            border-color: rgba(255,255,255,0.2) !important;
        }
        body.neon-low * {
            text-shadow: 0 0 3px currentColor !important;
            box-shadow: 0 0 5px currentColor !important;
        }

        /* ── WRAPPER PRINCIPAL ── */
        #batalla-wrap {
            width: 94%;
            max-width: 920px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.4));
        }

        /* ── TIMER HUD NEÓN ── */
        #timer {
            font-family: 'Bangers', cursive;
            font-size: 64px;
            color: #FFD700;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9),
                         0 0 20px rgba(255, 215, 0, 0.4),
                         3px 3px 0px #000;
            letter-spacing: 4px;
            text-align: center;
            transition: all 0.3s ease;
            line-height: 1;
            margin-bottom: 6px;
        }

        #timer.urgente {
            color: #ff3b30;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9),
                         0 0 25px rgba(255, 59, 48, 0.7),
                         3px 3px 0px #000;
            animation: pulso-critico 0.6s infinite alternate;
        }

        @keyframes pulso-critico {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.1);
            }
        }

        /* ── REGALO JUNTO AL NOMBRE ── */
        .queen-header-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .gift-img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8)) 
                    drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.7));
            transition: transform 0.2s ease;
        }

        .queen-name-img {
            height: 48px;
            max-width: 160px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.9))
                    drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
            transition: transform 0.2s ease;
        }

        .gift-img.bounce {
            animation: gift-bounce-resorte 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes gift-bounce-resorte {
            0% {
                transform: scale(1) rotate(0deg);
            }
            30% {
                transform: scale(1.5) rotate(-10deg);
            }
            60% {
                transform: scale(0.85) rotate(5deg);
            }
            80% {
                transform: scale(1.1) rotate(-2deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        /* ── BARRA DE PUNTOS GLASSMORPHISM ── */
        #bar-outer {
            height: 56px;
            overflow: hidden;
            display: flex;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7),
                        inset 0 4px 12px rgba(0, 0, 0, 0.6),
                        0 0 0 1px rgba(255, 255, 255, 0.08);
            border: 3px solid rgba(255, 255, 255, 0.05);
            padding: 3px;
            position: relative;
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
        }

        .queen-bar {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 30px;
            letter-spacing: 0.5px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9), 0 0 10px rgba(255,255,255,0.3);
            transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            overflow: hidden;
        }

        /* Efecto Glossy Superior */
        .queen-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.22) 0%, transparent 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* Barrido de luz diagonal animado */
        .queen-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 150%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent 30%, 
                rgba(255, 255, 255, 0.35) 50%, 
                transparent 70%
            );
            transform: skewX(-25deg);
            animation: sweep-light 4s infinite ease-in-out;
            z-index: 1;
        }

        @keyframes sweep-light {
            0% { left: -150%; }
            50% { left: 150%; }
            100% { left: 150%; }
        }

        /* ── FILA DE NOMBRES ── */
        #names-row {
            display: flex;
            justify-content: space-around;
        }

        .queen-name-slot {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: transform 0.2s ease;
        }

        .queen-name-slot:hover {
            transform: translateY(-2px);
        }

        .queen-label {
            font-family: 'Bangers', cursive;
            font-size: 38px;
            letter-spacing: 1.5px;
            text-shadow: 2px 2px 0px #000,
                         0 0 15px rgba(0, 0, 0, 0.8);
            line-height: 1;
        }

        /* ── SILLAS / TOP 3 DONADORES DE CADA BAILARINA ── */
        .donor-seats-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), inset 0 0 12px rgba(255, 255, 255, 0.05);
            margin-top: 6px;
            transition: all 0.3s ease;
        }

        .donor-seat-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            position: relative;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .donor-seat-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .donor-seat-circle .empty-seat-icon {
            width: 22px;
            height: 22px;
            opacity: 0.35;
            fill: currentColor;
        }

        .donor-seat-circle.filled {
            animation: seat-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes seat-pop {
            0% { transform: scale(0.7); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* ── BANNER GANADOR PREMIUM CON CONFETI ── */
        #anuncio-fin {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Bangers', cursive;
            font-size: 80px;
            color: #FFD700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.9), 5px 5px 0 #000;
            letter-spacing: 4px;
            text-align: center;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 35px 70px;
            border-radius: 30px;
            border: 4px solid #FFD700;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.95), 
                        0 0 40px rgba(255, 215, 0, 0.35);
            z-index: 9999;
            white-space: nowrap;
            animation: zoom-in-bounce 0.65s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        #anuncio-fin::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 30%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transform: rotate(30deg);
            animation: sweep-banner 4s infinite linear;
            z-index: 5;
        }

        @keyframes sweep-banner {
            0% { left: -60%; }
            100% { left: 160%; }
        }

        @keyframes zoom-in-bounce {
            from {
                transform: translate(-50%, -50%) scale(0.3);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        /* Contenedor de confeti */
        .confetti-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .confetti-particle {
            position: absolute;
            opacity: 0.85;
            border-radius: 2px;
        }

        @keyframes fall-confetti {
            0% {
                top: -20px;
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                top: 110%;
                transform: translateY(220px) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div id="batalla-wrap">
        <div id="timer">ESPERANDO BATALLA...</div>

        <!-- Barra de puntos -->
        <div id="bar-outer"></div>

        <!-- Nombres y Donadores -->
        <div id="names-row"></div>

    </div>

    <div id="anuncio-fin"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let participantesActivos = [];
        let equiposInfo = {};
        let APODOS = {};
        let puntosActuales = {};

        // Acumulado de donaciones por espectador para Top 3 donadores (Opción A)
        let donorStats = {}; // { [chica]: { [nick]: { nick, avatar, totalCoins } } }

        const timerEl = document.getElementById('timer');
        const anuncio = document.getElementById('anuncio-fin');
        const barOuter = document.getElementById('bar-outer');
        const namesRow = document.getElementById('names-row');

        // ── helpers ──
        function lightenColor(hex) {
            try {
                let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
                r = Math.min(255, r + 60); g = Math.min(255, g + 60); b = Math.min(255, b + 60);
                return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
            } catch (e) { return hex; }
        }

        function isLight(hex) {
            try { const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16); return (r * 299 + g * 587 + b * 114) / 1000 > 150; }
            catch (e) { return false; }
        }

        // ── Render completo de la batalla ──
        function renderBatalla(participantes, equipos, victorias, puntos) {
            participantesActivos = participantes;
            equiposInfo = equipos;
            puntosActuales = { ...puntos };
            donorStats = {}; // Reset acumulados en nuevo render de batalla

            const pct = 100 / participantes.length;

            // Barra de puntos
            barOuter.innerHTML = '';
            participantes.forEach(chica => {
                const eq = equipos[chica] || { nombre: chica, color: '#aaa' };
                const light = lightenColor(eq.color);
                const pts = puntos[chica] || 0;
                const bar = document.createElement('div');
                bar.id = 'bar-' + chica;
                bar.className = 'queen-bar';
                bar.style.background = `linear-gradient(90deg, ${eq.color}, ${light})`;
                bar.style.width = pct + '%';
                bar.textContent = pts;
                barOuter.appendChild(bar);
            });

            // Nombres y Píldora de Sillas/Donadores
            namesRow.innerHTML = '';
            participantes.forEach(chica => {
                const eq = equipos[chica] || { nombre: chica, color: '#fff', regalo_img: '', nombre_img: '' };
                const label = APODOS[chica] || eq.nombre || chica.toUpperCase();
                const regaloSrc = eq.regalo_img ? `/regalos/${encodeURIComponent(eq.regalo_img)}` : '';
                const nombreImgSrc = eq.nombre_img ? `/regalos/${encodeURIComponent(eq.nombre_img)}` : '';

                let nameContent = `<span class="queen-label" style="color:${eq.color}">${label}</span>`;
                if (nombreImgSrc) {
                    nameContent = `<img id="name-img-${chica}" class="queen-name-img" src="${nombreImgSrc}" alt="${chica}" onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='inline';">
                    <span class="queen-label" style="color:${eq.color}; display:none;">${label}</span>`;
                }

                namesRow.innerHTML += `
                <div class="queen-name-slot">
                    <div class="queen-header-box">
                        ${regaloSrc
                            ? `<img id="gift-${chica}" class="gift-img" src="${regaloSrc}" alt="${chica}" onerror="this.style.display='none'">`
                            : ''
                        }
                        ${nameContent}
                    </div>
                    <div class="donor-seats-pill" id="seats-pill-${chica}" style="border: 1px solid ${eq.color}50; background: linear-gradient(135deg, rgba(0,0,0,0.6) 0%, ${eq.color}18 100%); box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 10px ${eq.color}25;">
                        <div id="seats-${chica}" style="display:flex; gap:8px;"></div>
                    </div>
                </div>`;

                renderFeed(chica);
            });
        }

        // ── Actualizar barras ──
        function actualizarBarras(puntos) {
            puntosActuales = { ...puntos };
            let total = 0;
            participantesActivos.forEach(c => { total += (puntos[c] || 0); });
            const pct = 100 / participantesActivos.length;
            
            let lider = null;
            let maxPts = -1;
            
            participantesActivos.forEach(chica => {
                const barEl = document.getElementById('bar-' + chica);
                const pts = puntos[chica] || 0;
                if (pts > maxPts) {
                    maxPts = pts;
                    lider = chica;
                }
                if (barEl) {
                    let p = total === 0 ? pct : (pts / total) * 100;
                    p = Math.max(2, p); // mínimo visual
                    barEl.style.width = p + '%';
                    barEl.textContent = pts;
                }
            });

            // Hacer brillar el marco de la barra con el color del líder activo
            if (lider && equiposInfo[lider] && maxPts > 0) {
                const liderColor = equiposInfo[lider].color;
                barOuter.style.boxShadow = `0 8px 32px rgba(0, 0, 0, 0.7), 0 0 25px ${liderColor}66`;
                barOuter.style.borderColor = `${liderColor}80`;
            } else {
                barOuter.style.boxShadow = '';
                barOuter.style.borderColor = '';
            }
        }

        // ── Top 3 Donadores por Puntos Acumulados ──
        const EMPTY_SEAT_SVG = `<svg class="empty-seat-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M19,10V7A3,3 0 0,0 16,4H8A3,3 0 0,0 5,7V10A3,3 0 0,0 2,13V18A1,1 0 0,0 3,19H4A1,1 0 0,0 5,18V17H19V18A1,1 0 0,0 20,19H21A1,1 0 0,0 22,18V13A3,3 0 0,0 19,10M7,7A1,1 0 0,1 8,6H16A1,1 0 0,1 17,7V10H7V7M20,15H4V13A1,1 0 0,1 5,12H19A1,1 0 0,1 20,13V15Z"/></svg>`;

        function agregarViewer(nick, avatar, giftImg, chica, coins) {
            if (!chica || !participantesActivos.includes(chica)) return;

            if (!donorStats[chica]) donorStats[chica] = {};
            if (!donorStats[chica][nick]) {
                donorStats[chica][nick] = { nick, avatar, totalCoins: 0 };
            }
            if (avatar) donorStats[chica][nick].avatar = avatar;
            donorStats[chica][nick].totalCoins += (coins || 1);

            renderFeed(chica);

            // Animar la imagen de regalo a la izquierda del nombre
            if (giftImg) {
                const gifEl = document.getElementById('gift-' + chica);
                if (gifEl) {
                    gifEl.classList.remove('bounce');
                    void gifEl.offsetWidth;
                    gifEl.classList.add('bounce');
                }
            }
        }

        function renderFeed(chica) {
            const seatsContainer = document.getElementById('seats-' + chica);
            if (!seatsContainer) return;

            const eq = equiposInfo[chica] || { color: '#ffffff' };
            const chicaDonors = Object.values(donorStats[chica] || {});
            
            // Ordenar de mayor a menor según los puntos acumulados
            chicaDonors.sort((a, b) => b.totalCoins - a.totalCoins);

            const top3 = chicaDonors.slice(0, 3);
            let html = '';

            for (let i = 0; i < 3; i++) {
                const donor = top3[i];
                if (donor && donor.avatar) {
                    html += `
                    <div class="donor-seat-circle filled" style="border-color: ${eq.color}; box-shadow: 0 0 10px ${eq.color}aa, 0 0 16px ${eq.color}44;">
                        <img src="${donor.avatar}" title="${donor.nick} (${donor.totalCoins} pts)">
                    </div>`;
                } else if (donor) {
                    const initial = donor.nick.slice(0, 1).toUpperCase();
                    html += `
                    <div class="donor-seat-circle filled" style="border-color: ${eq.color}; color: #fff; font-weight: 900; font-size: 16px; box-shadow: 0 0 10px ${eq.color}aa;">
                        ${initial}
                    </div>`;
                } else {
                    html += `
                    <div class="donor-seat-circle" style="border-color: ${eq.color}50; color: ${eq.color};">
                        ${EMPTY_SEAT_SVG}
                    </div>`;
                }
            }

            seatsContainer.innerHTML = html;
        }

        // Generar partículas de confeti de forma dinámica
        function crearConfeti() {
            const container = document.querySelector('.confetti-container');
            if (!container) return;
            container.innerHTML = '';
            const colores = ['#FFD700', '#FF5733', '#33FF57', '#3357FF', '#FF33FF', '#33FFFF'];
            for (let i = 0; i < 60; i++) {
                const p = document.createElement('div');
                p.className = 'confetti-particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = -10 - Math.random() * 20 + 'px';
                p.style.backgroundColor = colores[Math.floor(Math.random() * colores.length)];
                p.style.width = 6 + Math.random() * 8 + 'px';
                p.style.height = 6 + Math.random() * 8 + 'px';
                p.style.transform = `rotate(${Math.random() * 360}deg)`;
                p.style.animation = `fall-confetti ${1.5 + Math.random() * 2}s linear infinite`;
                p.style.animationDelay = Math.random() * 1.5 + 's';
                container.appendChild(p);
            }
        }

        // ── SOCKET EVENTS ──
        socket.on('batallaInicio', (data) => {
            anuncio.style.display = 'none';
            timerEl.classList.remove('urgente');
            timerEl.style.color = '#FFD700';
            donorStats = {};
            renderBatalla(data.participantes, data.equipos || equiposInfo, data.victorias || {}, data.puntos || {});
        });

        socket.on('batallaTick', (tiempo) => {
            let m = Math.floor(tiempo / 60).toString().padStart(2, '0');
            let s = (tiempo % 60).toString().padStart(2, '0');
            timerEl.textContent = m + ':' + s;
            if (tiempo <= 10) { timerEl.classList.add('urgente'); }
            else { timerEl.classList.remove('urgente'); }
        });

        socket.on('batallaPuntos', actualizarBarras);

        socket.on('nuevoRegalo', (data) => {
            // data = { nombre, viewer, avatar, giftImg, queenColor, coins, giftName }
            if (data.viewer && participantesActivos.includes(data.nombre)) {
                agregarViewer(data.viewer, data.avatar || '', data.giftImg || '', data.nombre, data.coins || 0);
            }
        });

        socket.on('batallaFin', (data) => {
            const esEmpate = (data.ganadora === 'EMPATE' || data.ganadora === 'SIN PUNTOS');
            const nombreDisplay = esEmpate ? data.ganadora : (APODOS[data.ganadora] || data.ganadora);
            const texto = esEmpate ? nombreDisplay : '🏆 ¡GANÓ ' + nombreDisplay + '!';
            timerEl.textContent = texto;
            timerEl.classList.remove('urgente');
            
            // Inyectar contenedor de confeti y texto con z-index
            anuncio.innerHTML = `<div class="confetti-container"></div><div style="position:relative; z-index: 10;">${texto}</div>`;
            
            anuncio.style.color = esEmpate ? '#fff' : '#FFD700';
            anuncio.style.borderColor = esEmpate ? '#fff' : '#FFD700';
            anuncio.style.display = 'block';
            
            crearConfeti();
            setTimeout(() => { anuncio.style.display = 'none'; }, 6000);
        });

        socket.on('batallaCancelada', () => {
            timerEl.textContent = 'ESPERANDO BATALLA...';
            timerEl.classList.remove('urgente');
            anuncio.style.display = 'none';
        });

        socket.on('queensActualizadas', (data) => {
            equiposInfo = data.equipos || equiposInfo;
            if (data.apodos) APODOS = data.apodos;
        });

        // ── Carga inicial ──
        async function init() {
            const all = await (await fetch('/api/queens/all')).json();
            all.forEach(q => {
                if (q.activo) {
                    const display = (q.apodo && q.apodo.trim()) ? q.apodo.trim() : q.name;
                    equiposInfo[q.name] = {
                        nombre: display.toUpperCase(),
                        color: q.color,
                        regalo_img: q.regalo_img || ''
                    };
                }
            });
            const apodosMap = await (await fetch('/api/apodos')).json();
            APODOS = apodosMap;
        }
        init();

        // ── BRAND MANAGER LOGIC ──
        function loadGoogleFont(fontName) {
            if (!fontName) return;
            const fontId = 'custom-google-font';
            let link = document.getElementById(fontId);
            if (!link) {
                link = document.createElement('link');
                link.id = fontId;
                link.rel = 'stylesheet';
                document.head.appendChild(link);
            }
            link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(fontName)}:wght@400;700;800;900&display=swap`;
            document.body.style.fontFamily = `'${fontName}', sans-serif`;
        }

        function aplicarMarca(config) {
            if (!config) return;
            // Tipografía
            if (config.fontFamily) {
                loadGoogleFont(config.fontFamily);
            }
            // Logotipo
            const logoContainer = document.getElementById('agency-logo-container');
            const logoImg = document.getElementById('agency-logo');
            if (logoContainer && logoImg) {
                if (config.logoUrl) {
                    logoImg.src = config.logoUrl;
                    logoContainer.style.opacity = '1';
                    logoContainer.style.transform = 'scale(1)';
                } else {
                    logoContainer.style.opacity = '0';
                    logoContainer.style.transform = 'scale(0.8)';
                }
            }
            // Brillo neón
            document.body.classList.remove('neon-none', 'neon-low', 'neon-high');
            if (config.neonIntensity && config.neonIntensity !== 'normal') {
                document.body.classList.add('neon-' + config.neonIntensity);
            }
        }

        socket.on('marcaCambiado', aplicarMarca);
    </script>

    <!-- Logotipo de la Agencia Flotante -->
    <div id="agency-logo-container" style="position: absolute; top: 20px; right: 20px; z-index: 9999; pointer-events: none; transition: all 0.5s ease; opacity: 0; transform: scale(0.8);">
        <img id="agency-logo" src="" style="max-height: 80px; max-width: 150px; object-fit: contain; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));">
    </div>
</body>
</html>
