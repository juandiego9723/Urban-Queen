<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikDance — Restablecer Contraseña</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        :root {
            --bg: #090b11;
            --surface: #101422;
            --surface2: #161c2f;
            --border: rgba(255, 255, 255, 0.06);
            --text: #f1f5f9;
            --muted: #64748b;
            --pink: #ec4899;
            --indigo: #6366f1;
            --green: #10b981;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--pink), var(--indigo));
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .title {
            font-size: 20px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 13px;
            color: var(--muted);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }
        .input {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
            width: 100%;
        }
        .input:focus {
            border-color: var(--indigo);
            box-shadow: 0 0 0 3px rgba(99,102,241,.18);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: all .2s ease;
            background: linear-gradient(135deg, var(--indigo), var(--pink));
            color: #fff;
            margin-top: 10px;
        }
        .btn:hover {
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
            filter: brightness(1.1);
        }
        .box-msg {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        .box-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
        }
        .box-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--green);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="title">Restablecer Contraseña</div>
            <div class="subtitle" id="user-info">Validando token de seguridad...</div>
        </div>

        <div id="error-box" class="box-msg box-error"></div>
        <div id="success-box" class="box-msg box-success"></div>

        <form id="reset-form" style="display: none;">
            <div class="form-group">
                <label class="label">Nueva Contraseña</label>
                <input type="password" id="newPassword" class="input" placeholder="Mínimo 4 caracteres" required autocomplete="new-password">
            </div>
            <div class="form-group">
                <label class="label">Confirmar Nueva Contraseña</label>
                <input type="password" id="confirmPassword" class="input" placeholder="••••••••" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn" id="btn-save">Guardar Nueva Contraseña</button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token') || '';
        const errorBox = document.getElementById('error-box');
        const successBox = document.getElementById('success-box');
        const resetForm = document.getElementById('reset-form');
        const userInfo = document.getElementById('user-info');

        async function validarToken() {
            if (!token) {
                errorBox.textContent = '❌ Enlace de recuperación incompleto o sin token.';
                errorBox.style.display = 'block';
                userInfo.textContent = 'Token no proporcionado';
                return;
            }

            try {
                const res = await fetch(`/api/validate-token?token=${encodeURIComponent(token)}`);
                const data = await res.json();

                if (res.ok && data.valid) {
                    userInfo.textContent = `Restableciendo contraseña para: @${data.username}`;
                    resetForm.style.display = 'block';
                } else {
                    errorBox.textContent = '❌ ' + (data.error || 'Token inválido o expirado.');
                    errorBox.style.display = 'block';
                    userInfo.textContent = 'Acceso no permitido';
                }
            } catch(e) {
                errorBox.textContent = '❌ Error de conexión al validar el token.';
                errorBox.style.display = 'block';
            }
        }

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                errorBox.textContent = '❌ Las contraseñas no coinciden.';
                errorBox.style.display = 'block';
                return;
            }

            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            btn.textContent = 'Guardando...';

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                if (res.ok) {
                    const data = await res.json();
                    errorBox.style.display = 'none';
                    resetForm.style.display = 'none';
                    successBox.textContent = '✅ ' + (data.message || 'Contraseña restablecida exitosamente.');
                    successBox.style.display = 'block';
                    userInfo.textContent = '¡Proceso completado!';

                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2500);
                } else {
                    const text = await res.text();
                    errorBox.textContent = '❌ ' + text;
                    errorBox.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Guardar Nueva Contraseña';
                }
            } catch(e) {
                errorBox.textContent = '❌ Error de red al restablecer la contraseña.';
                errorBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Guardar Nueva Contraseña';
            }
        });

        validarToken();
    </script>
</body>
</html>
