<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikDance — Iniciar Sesión</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        :root {
            --bg: #090b11;
            --surface: #101422;
            --surface2: #161c2f;
            --border: rgba(255, 255, 255, 0.06);
            --text: #f1f5f9;
            --muted: #64748b;
            --pink: #ec4899;
            --indigo: #6366f1;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--pink), var(--indigo));
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.8px;
            color: var(--text);
        }
        .logo span {
            color: var(--pink);
            text-shadow: 0 0 12px rgba(236, 72, 153, 0.4);
        }
        .subtitle {
            font-size: 13px;
            color: var(--muted);
            margin-top: 6px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }
        .input {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
            width: 100%;
        }
        .input:focus {
            border-color: var(--indigo);
            box-shadow: 0 0 0 3px rgba(99,102,241,.18);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: all .2s ease;
            background: var(--indigo);
            color: #fff;
            margin-top: 10px;
        }
        .btn:hover {
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
            filter: brightness(1.1);
        }
        .btn:active {
            transform: scale(.98);
        }
        .footer-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--muted);
        }
        .footer-link a {
            color: var(--pink);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.15s;
        }
        .footer-link a:hover {
            color: #f472b6;
        }
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        /* Modal Glassmorphism */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
            animation: modalFadeIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 35px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            position: relative;
        }
        .modal-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--pink), var(--indigo));
            border-radius: 18px 18px 0 0;
        }
        .modal-close {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.15s;
        }
        .modal-close:hover { color: #fff; }
        .modal-title { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .modal-subtitle { font-size: 12px; color: var(--muted); margin-bottom: 20px; line-height: 1.4; }
        .success-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #34d399;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="header" style="margin-bottom: 25px;">
            <div class="logo"><img src="/logo-tikdance-horizontal.png" alt="TikDance" style="max-height:55px;vertical-align:middle"></div>
        </div>

        <div id="error-message" class="error-box"></div>

        <form id="login-form">
            <div class="form-group">
                <label class="label">Nombre de Usuario</label>
                <input type="text" id="username" class="input" placeholder="ej: mi_academia" required autocomplete="username">
            </div>
            <div class="form-group">
                <label class="label">Contraseña</label>
                <input type="password" id="password" class="input" placeholder="••••••••" required autocomplete="current-password">
                <div style="text-align: right; margin-top: 6px;">
                    <a href="#" onclick="abrirModalRecuperacion(event)" style="color: var(--muted); font-size: 12px; text-decoration: none;">¿Olvidaste tu contraseña?</a>
                </div>
            </div>
            <button type="submit" class="btn">Iniciar Sesión</button>
        </form>

        <div class="footer-link">
            ¿No tienes cuenta? <a href="/register">Regístrate aquí</a>
        </div>
    </div>

    <!-- Modal Emergente de Recuperación de Contraseña -->
    <div id="forgot-modal" class="modal-overlay">
        <div class="modal-box">
            <button class="modal-close" onclick="cerrarModalRecuperacion()">&times;</button>
            <div class="modal-title">🔑 Recuperar Contraseña</div>
            <div class="modal-subtitle">Ingresa tu nombre de usuario para solicitar un enlace de restablecimiento seguro.</div>

            <div id="modal-error" class="error-box"></div>
            <div id="modal-success" class="success-box"></div>

            <form id="forgot-form" onsubmit="enviarSolicitudRecuperacion(event)">
                <div class="form-group">
                    <label class="label">Nombre de Usuario</label>
                    <input type="text" id="forgot-username" class="input" placeholder="ej: mi_academia" required autocomplete="username">
                </div>
                <button type="submit" class="btn" id="btn-forgot">Generar Enlace de Recuperación</button>
            </form>
            <div id="action-reset" style="display:none; margin-top: 15px;">
                <button class="btn" style="background: linear-gradient(90deg, var(--pink), var(--indigo));" id="btn-go-reset">Ir a Restablecer Contraseña Ahora ➔</button>
            </div>
        </div>
    </div>

    <script>
        // Check for error in query param
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error')) {
            const errBox = document.getElementById('error-message');
            errBox.textContent = decodeURIComponent(urlParams.get('error'));
            errBox.style.display = 'block';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errBox = document.getElementById('error-message');

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    window.location.href = '/control';
                } else {
                    const text = await res.text();
                    errBox.textContent = text;
                    errBox.style.display = 'block';
                }
            } catch (err) {
                errBox.textContent = 'Error de conexión con el servidor';
                errBox.style.display = 'block';
            }
        });

        function abrirModalRecuperacion(e) {
            if (e) e.preventDefault();
            document.getElementById('forgot-modal').classList.add('active');
            document.getElementById('forgot-username').value = '';
            document.getElementById('modal-error').style.display = 'none';
            document.getElementById('modal-success').style.display = 'none';
            document.getElementById('action-reset').style.display = 'none';
            document.getElementById('forgot-form').style.display = 'block';
        }

        function cerrarModalRecuperacion() {
            document.getElementById('forgot-modal').classList.remove('active');
        }

        async function enviarSolicitudRecuperacion(e) {
            e.preventDefault();
            const username = document.getElementById('forgot-username').value.trim();
            if (!username) return;

            const errBox = document.getElementById('modal-error');
            const succBox = document.getElementById('modal-success');
            const btn = document.getElementById('btn-forgot');
            const actionReset = document.getElementById('action-reset');
            const btnGoReset = document.getElementById('btn-go-reset');

            errBox.style.display = 'none';
            succBox.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Procesando...';

            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });

                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('forgot-form').style.display = 'none';
                    succBox.innerHTML = '<strong>✅ Token Generado Exitosamente</strong><br><span style="font-size:11px;opacity:0.9">Tu enlace de restablecimiento seguro está listo.</span>';
                    succBox.style.display = 'block';
                    actionReset.style.display = 'block';
                    btnGoReset.onclick = () => { window.location.href = data.resetUrl; };
                } else {
                    const text = await res.text();
                    errBox.textContent = '❌ ' + text;
                    errBox.style.display = 'block';
                }
            } catch(err) {
                errBox.textContent = '❌ Error de conexión con el servidor';
                errBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Generar Enlace de Recuperación';
            }
        }
    </script>
</body>
</html>
