<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modo Batalla Urban Queens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #00FF00;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 22px;
        }

        /* ── WRAPPER PRINCIPAL ── */
        #batalla-wrap {
            width: 92%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* ── TIMER ── */
        #timer {
            font-family: 'Bangers', cursive;
            font-size: 58px;
            color: #FFD700;
            text-shadow: 3px 3px 0 #000, 0 0 20px rgba(255,215,0,0.6);
            letter-spacing: 3px;
            text-align: center;
            transition: color 0.3s;
            line-height: 1;
            margin-bottom: 4px;
        }
        #timer.urgente { color: #ff4444; animation: pulso 0.6s infinite; }
        @keyframes pulso { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }

        /* ── FILA IMÁGENES DE REGALO ── */
        #gift-row {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            gap: 4px;
            min-height: 60px;
        }

        .gift-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .gift-img {
            width: 56px;
            height: 56px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.7)) drop-shadow(2px 2px 4px rgba(0,0,0,0.8));
            transition: transform 0.2s;
        }
        .gift-img.bounce {
            animation: gift-bounce 0.45s ease;
        }
        @keyframes gift-bounce {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.5) rotate(-6deg); }
            70%  { transform: scale(0.9) rotate(3deg); }
            100% { transform: scale(1); }
        }

        /* ── BARRA DE PUNTOS ── */
        #bar-outer {
            height: 50px;
            border-radius: 25px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 2px 6px rgba(0,0,0,0.3);
            border: 3px solid rgba(0,0,0,0.4);
        }

        .queen-bar {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bangers', cursive;
            font-size: 28px;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .queen-bar::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 45%;
            background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, transparent 100%);
            pointer-events: none;
        }

        /* ── FILA DE NOMBRES ── */
        #names-row {
            display: flex;
            justify-content: space-around;
        }

        .queen-name-slot {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
        }

        .queen-label {
            font-family: 'Bangers', cursive;
            font-size: 22px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 #000, 0 0 10px rgba(0,0,0,0.6);
            line-height: 1;
        }

        .queen-vics {
            font-size: 11px;
            font-weight: 800;
            color: #FFD700;
            text-shadow: 1px 1px 0 #000;
            letter-spacing: 0.5px;
        }

        /* ── FEED DE ESPECTADORES ── */
        #viewer-feed {
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 36px;
            flex-wrap: nowrap;
            overflow: hidden;
            padding: 2px 4px;
            justify-content: center;
        }

        .viewer-chip {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,0,0,0.65);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 30px;
            padding: 3px 10px 3px 4px;
            animation: slide-in 0.3s ease;
            flex-shrink: 0;
        }
        @keyframes slide-in {
            from { opacity: 0; transform: scale(0.6) translateY(8px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .viewer-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.4);
            background: #333;
        }

        .viewer-nick {
            font-size: 11px;
            font-weight: 800;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
            max-width: 75px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .viewer-gift-icon {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        /* ── ANUNCIO FINAL ── */
        #anuncio-fin {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Bangers', cursive;
            font-size: 72px;
            color: #FFD700;
            text-shadow: 0 0 30px rgba(255,215,0,0.9), 5px 5px 0 #000;
            letter-spacing: 4px;
            text-align: center;
            background: rgba(0,0,0,0.88);
            padding: 20px 40px;
            border-radius: 20px;
            border: 3px solid #FFD700;
            z-index: 9999;
            white-space: nowrap;
            animation: zoom-in 0.4s ease;
        }
        @keyframes zoom-in {
            from { transform: translate(-50%,-50%) scale(0.5); opacity: 0; }
            to   { transform: translate(-50%,-50%) scale(1);   opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="batalla-wrap">
        <div id="timer">ESPERANDO BATALLA...</div>

        <!-- Imágenes de regalo -->
        <div id="gift-row"></div>

        <!-- Barra de puntos -->
        <div id="bar-outer"></div>

        <!-- Nombres y victorias -->
        <div id="names-row"></div>

        <!-- Feed de espectadores -->
        <div id="viewer-feed"></div>
    </div>

    <div id="anuncio-fin"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
    const socket = io();
    let participantesActivos = [];
    let equiposInfo = {};
    let APODOS = {};
    let puntosActuales = {};

    // Feed de espectadores: máximo 8 chips visibles
    const MAX_VIEWERS = 8;
    let feedViewers = []; // [{nick, avatar, giftImg, color}]

    const timerEl    = document.getElementById('timer');
    const anuncio    = document.getElementById('anuncio-fin');
    const giftRow    = document.getElementById('gift-row');
    const barOuter   = document.getElementById('bar-outer');
    const namesRow   = document.getElementById('names-row');
    const viewerFeed = document.getElementById('viewer-feed');

    // ── helpers ──
    function lightenColor(hex) {
        try {
            let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
            r = Math.min(255,r+60); g = Math.min(255,g+60); b = Math.min(255,b+60);
            return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
        } catch(e) { return hex; }
    }

    function isLight(hex) {
        try { const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return (r*299+g*587+b*114)/1000>150; }
        catch(e){return false;}
    }

    // ── Render completo de la batalla ──
    function renderBatalla(participantes, equipos, victorias, puntos) {
        participantesActivos = participantes;
        equiposInfo = equipos;
        puntosActuales = { ...puntos };

        const pct = 100 / participantes.length;

        // Imágenes de regalo
        giftRow.innerHTML = '';
        participantes.forEach(chica => {
            const eq = equipos[chica] || { nombre: chica, color: '#fff', regalo_img: '' };
            const imgSrc = eq.regalo_img ? `/regalos/${encodeURIComponent(eq.regalo_img)}` : '';
            giftRow.innerHTML += `
                <div class="gift-slot">
                    ${imgSrc
                        ? `<img id="gift-${chica}" class="gift-img" src="${imgSrc}" alt="${chica}" onerror="this.style.display='none'">`
                        : `<div style="width:52px;height:52px"></div>`
                    }
                </div>`;
        });

        // Barra de puntos
        barOuter.innerHTML = '';
        participantes.forEach(chica => {
            const eq = equipos[chica] || { nombre: chica, color: '#aaa' };
            const light = lightenColor(eq.color);
            const pts = puntos[chica] || 0;
            const bar = document.createElement('div');
            bar.id = 'bar-' + chica;
            bar.className = 'queen-bar';
            bar.style.background = `linear-gradient(90deg, ${eq.color}, ${light})`;
            bar.style.width = pct + '%';
            bar.textContent = pts;
            barOuter.appendChild(bar);
        });

        // Nombres
        namesRow.innerHTML = '';
        participantes.forEach(chica => {
            const eq = equipos[chica] || { nombre: chica, color: '#fff' };
            const label = APODOS[chica] || eq.nombre || chica.toUpperCase();
            namesRow.innerHTML += `
                <div class="queen-name-slot">
                    <span class="queen-label" style="color:${eq.color}">${label}</span>
                    <span class="queen-vics" id="vic-${chica}">👑 X${victorias[chica] || 0}</span>
                </div>`;
        });
    }

    // ── Actualizar barras ──
    function actualizarBarras(puntos) {
        puntosActuales = { ...puntos };
        let total = 0;
        participantesActivos.forEach(c => { total += (puntos[c] || 0); });
        const pct = 100 / participantesActivos.length;
        participantesActivos.forEach(chica => {
            const barEl = document.getElementById('bar-' + chica);
            if (barEl) {
                let p = total === 0 ? pct : ((puntos[chica] || 0) / total) * 100;
                p = Math.max(2, p); // mínimo visual
                barEl.style.width = p + '%';
                barEl.textContent = puntos[chica] || 0;
            }
        });
    }

    // ── Feed de espectadores ──
    function agregarViewer(nick, avatar, giftImg, queenColor) {
        // Evitar duplicados consecutivos
        if (feedViewers.length && feedViewers[0].nick === nick) return;
        feedViewers.unshift({ nick, avatar, giftImg, queenColor });
        if (feedViewers.length > MAX_VIEWERS) feedViewers.pop();
        renderFeed();
        // Animar imagen del regalo
        if (giftImg) {
            const gifEl = Array.from(document.querySelectorAll('.gift-img')).find(img => img.src.includes(encodeURIComponent(giftImg)));
            if (gifEl) {
                gifEl.classList.remove('bounce');
                void gifEl.offsetWidth;
                gifEl.classList.add('bounce');
            }
        }
    }

    function renderFeed() {
        viewerFeed.innerHTML = feedViewers.map(v => {
            const avatarHtml = v.avatar
                ? `<img class="viewer-avatar" src="${v.avatar}" onerror="this.src='/regalos/corazon.png'">`
                : `<div class="viewer-avatar" style="background:${v.queenColor||'#555'};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff">${v.nick.slice(0,1).toUpperCase()}</div>`;
            const giftHtml = v.giftImg
                ? `<img class="viewer-gift-icon" src="/regalos/${encodeURIComponent(v.giftImg)}" onerror="this.style.display='none'">`
                : '';
            return `<div class="viewer-chip" style="border-color:${v.queenColor||'rgba(255,255,255,0.15)'}40">
                ${avatarHtml}
                <span class="viewer-nick">${v.nick}</span>
                ${giftHtml}
            </div>`;
        }).join('');
    }

    // ── SOCKET EVENTS ──
    socket.on('batallaInicio', (data) => {
        anuncio.style.display = 'none';
        timerEl.classList.remove('urgente');
        timerEl.style.color = '#FFD700';
        feedViewers = [];
        viewerFeed.innerHTML = '';
        renderBatalla(data.participantes, data.equipos || equiposInfo, data.victorias || {}, data.puntos || {});
    });

    socket.on('batallaTick', (tiempo) => {
        let m = Math.floor(tiempo / 60).toString().padStart(2,'0');
        let s = (tiempo % 60).toString().padStart(2,'0');
        timerEl.textContent = m + ':' + s;
        if (tiempo <= 10) { timerEl.classList.add('urgente'); }
        else { timerEl.classList.remove('urgente'); }
    });

    socket.on('batallaPuntos', actualizarBarras);

    socket.on('nuevoRegalo', (data) => {
        // data = { nombre, viewer, avatar, giftImg, queenColor }
        if (data.viewer && participantesActivos.includes(data.nombre)) {
            const col = (equiposInfo[data.nombre] || {}).color || '#fff';
            agregarViewer(data.viewer, data.avatar || '', data.giftImg || '', col);
        }
    });

    socket.on('batallaFin', (data) => {
        const esEmpate = (data.ganadora === 'EMPATE' || data.ganadora === 'SIN PUNTOS');
        const nombreDisplay = esEmpate ? data.ganadora : (APODOS[data.ganadora] || data.ganadora);
        const texto = esEmpate ? nombreDisplay : '🏆 ¡GANÓ ' + nombreDisplay + '!';
        timerEl.textContent = texto;
        timerEl.classList.remove('urgente');
        anuncio.textContent = texto;
        anuncio.style.color = esEmpate ? '#fff' : '#FFD700';
        anuncio.style.borderColor = esEmpate ? '#fff' : '#FFD700';
        anuncio.style.display = 'block';
        if (!esEmpate && data.victorias) {
            const vicEl = document.getElementById('vic-' + data.ganadora);
            if (vicEl) vicEl.textContent = '👑 X' + data.victorias[data.ganadora];
        }
        setTimeout(() => { anuncio.style.display = 'none'; }, 6000);
    });

    socket.on('batallaCancelada', () => {
        timerEl.textContent = 'ESPERANDO BATALLA...';
        timerEl.classList.remove('urgente');
        anuncio.style.display = 'none';
    });

    socket.on('queensActualizadas', (data) => {
        equiposInfo = data.equipos || equiposInfo;
        if (data.apodos) APODOS = data.apodos;
    });

    // ── Carga inicial ──
    async function init() {
        const all = await (await fetch('/api/queens/all')).json();
        all.forEach(q => {
            if (q.activo) {
                const display = (q.apodo && q.apodo.trim()) ? q.apodo.trim() : q.name;
                equiposInfo[q.name] = {
                    nombre: display.toUpperCase(),
                    color: q.color,
                    regalo_img: q.regalo_img || ''
                };
            }
        });
        const apodosMap = await (await fetch('/api/apodos')).json();
        APODOS = apodosMap;
    }
    init();
    </script>
</body>
</html>
