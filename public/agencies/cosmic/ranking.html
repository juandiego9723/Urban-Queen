<!DOCTYPE html>
<html lang="es">
    <head>
    <!-- Inyección de multi-cuenta -->
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const user = urlParams.get('user');
            if (user) {
                const originalFetch = window.fetch;
                window.fetch = function(url, options) {
                    if (typeof url === 'string' && !url.includes('user=')) {
                        const sep = url.includes('?') ? '&' : '?';
                        url = url + sep + 'user=' + encodeURIComponent(user);
                    }
                    return originalFetch(url, options);
                };
                const originalIo = window.io;
                if (originalIo) {
                    window.io = function(opts) {
                        opts = opts || {};
                        opts.query = opts.query || {};
                        opts.query.user = user;
                        return originalIo(opts);
                    };
                } else {
                    let _io = undefined;
                    Object.defineProperty(window, 'io', {
                        get: function() { return _io; },
                        set: function(val) {
                            _io = function(opts) {
                                opts = opts || {};
                                opts.query = opts.query || {};
                                opts.query.user = user;
                                return val(opts);
                            };
                        },
                        configurable: true
                    });
                }
            }
        })();
    </script>
        <meta charset="UTF-8">
        <title>Ranking</title>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,800;0,900;1,400;1,700;1,800;1,900&family=Inter:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600;1,700&display=swap"
              rel="stylesheet">
        
        <style>
        :root {
            --orange-neon: #ff8c00;
            --orange-bright: #ffa200;
            --orange-drip: #ff7300;
            --orange-glow: rgba(255, 140, 0, 0.75);
            --purple-neon: #a855f7;
            --purple-deep: #25094d;
            --purple-glow: rgba(168, 85, 247, 0.65);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body { 
            background-color: transparent; 
            font-family: 'Inter', sans-serif; 
            color: white; 
            margin: 0; 
            padding: 15px;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            overflow: hidden;
        }
        
        .container { 
            width: 320px; 
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            transition: all 0.3s ease;
        }

        /* ── TEMA CLÁSICO ── */
        .container.theme-clasico {
            background: rgba(22, 38, 26, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
            margin-top: 0;
        }

        .container.theme-clasico .top-pumpkin-anchor,
        .container.theme-clasico .drip-top-svg,
        .container.theme-clasico .drip-bottom-svg,
        .container.theme-clasico .spiderweb-corner,
        .container.theme-clasico::after {
            display: none !important;
        }

        /* ── TEMA HALLOWEEN ── */
        .container.theme-halloween {
            background: rgba(16, 7, 32, 0.90);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2.5px solid var(--orange-bright);
            border-radius: 24px;
            padding: 22px 16px 16px 16px;
            box-shadow: 
                0 0 18px var(--orange-glow),
                0 0 35px var(--purple-glow),
                inset 0 0 18px rgba(168, 85, 247, 0.35);
            margin-top: 24px;
            overflow: visible;
        }

        .container.theme-halloween::after {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 20px;
            border: 1.5px solid rgba(168, 85, 247, 0.7);
            pointer-events: none;
            box-shadow: inset 0 0 10px rgba(168, 85, 247, 0.3);
        }

        .top-pumpkin-anchor {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pumpkin-roof {
            width: 46px;
            height: 40px;
            filter: drop-shadow(0 0 10px var(--orange-glow));
            animation: pumpkinFlicker 3s infinite alternate ease-in-out;
        }

        @keyframes pumpkinFlicker {
            0%, 100% { filter: drop-shadow(0 0 8px var(--orange-glow)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 16px rgba(255, 170, 0, 0.95)) drop-shadow(0 0 4px #ffee00); transform: scale(1.06); }
        }

        .drip-top-svg {
            position: absolute;
            top: -1px;
            left: 20px;
            right: 20px;
            width: calc(100% - 40px);
            height: 12px;
            pointer-events: none;
            z-index: 5;
            filter: drop-shadow(0 2px 4px var(--orange-glow));
        }

        .drip-bottom-svg {
            position: absolute;
            bottom: -9px;
            left: 15px;
            right: 15px;
            width: calc(100% - 30px);
            height: 14px;
            pointer-events: none;
            z-index: 5;
            filter: drop-shadow(0 2px 4px var(--orange-glow));
        }

        .spiderweb-corner {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 75px;
            height: 75px;
            pointer-events: none;
            opacity: 0.55;
            filter: drop-shadow(0 0 4px var(--purple-neon));
            z-index: 1;
        }
        
        .header-box {
            text-align: center;
            cursor: pointer;
            user-select: none;
            padding-bottom: 8px;
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 4px;
            order: -1;
        }

        .header-titulo { 
            font-family: emoji, sans-serif;
            font-size: 1.35rem; 
            font-style: italic;
            font-weight: 850;
            margin: 0; 
            color: #ffffff; 
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .modo-label {
            font-family: 'Inter', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            margin-top: 4px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }
        .row:last-child {
            border-bottom: none;
        }
        
        .row.is-out {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            padding: 8px 12px;
            margin-top: 4px;
            border-bottom: none;
        }
        
        .row-left {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-grow: 1;
        }
        
        .rank-num {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.55rem;
            font-weight: 800;
            font-style: italic;
            width: 28px;
            text-align: center;
            flex-shrink: 0;
        }
        .rank-1 { color: #ffee00; text-shadow: 0 0 8px rgba(255, 238, 0, 0.3); }
        .rank-2 { color: #00f2fe; text-shadow: 0 0 8px rgba(0, 242, 254, 0.3); }
        .rank-3 { color: #ff8c00; text-shadow: 0 0 8px rgba(255, 140, 0, 0.3); }
        .rank-other { color: #ffffff; }
        .rank-out { color: rgba(255, 255, 255, 0.3); text-decoration: line-through; }
        
        .out-badge {
            border: 1.5px solid #ff3b30;
            color: #ff3b30;
            background: rgba(255, 59, 48, 0.15);
            font-size: 0.65rem;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            padding: 1px 5px;
            border-radius: 6px;
            margin-left: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
            vertical-align: middle;
            flex-shrink: 0;
        }
        
        .avatar-wrapper {
            position: relative;
            width: 40px;
            height: 40px;
            margin-left: 10px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        
        .queen-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            display: none;
        }
        
        .queen-avatar-fallback {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }
        
        .name { 
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem; 
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px; 
            transition: color 0.3s;
        }
        .name-out {
            color: rgba(255, 255, 255, 0.3);
        }
        
        .puntos { 
            font-family: 'Inter', sans-serif;
            font-size: 1.15rem; 
            font-weight: 700;
            color: #ffffff;
            text-align: right;
            min-width: 60px;
            transition: all 0.3s;
        }
        .puntos-out {
            color: rgba(255, 255, 255, 0.3);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); color: #ffee00; text-shadow: 0 0 10px rgba(255, 238, 0, 0.5); }
            100% { transform: scale(1); }
        }
        .update-anim { display: inline-block; animation: pulse 0.4s ease-out; }
        </style>
    </head>
    <body>

            <div class="header-box" onclick="toggleModo()">
                <div class="header-titulo" id="titulo-ranking">RANKING SEMANAL</div>
                <div class="modo-label" id="modo-label">CLICK PARA CAMBIAR</div>

        <script src="/js/iframe-bridge.js"></script>
        <script src="/socket.io/socket.io.js"></script>
        <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userParam = urlParams.get('user') || '';
        const themeParam = (urlParams.get('theme') || 'halloween').toLowerCase();

        const containerEl = document.getElementById('ranking-container');
        if (themeParam === 'clasico' || themeParam === 'default') {
            containerEl.classList.remove('theme-halloween');
            containerEl.classList.add('theme-clasico');
        } else {
            containerEl.classList.remove('theme-clasico');
            containerEl.classList.add('theme-halloween');
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                if (containerEl.classList.contains('theme-halloween')) {
                    containerEl.classList.remove('theme-halloween');
                    containerEl.classList.add('theme-clasico');
                } else {
                    containerEl.classList.remove('theme-clasico');
                    containerEl.classList.add('theme-halloween');
                }
            }
        });
        const socket = window.__iframeBridgeSocket || io({ query: userParam ? { user: userParam } : {} });
        let modo = 'semanal'; // 'semanal', 'mensual' o 'diario'
        let dataSemanal = {};
        let dataMensual = {};
        let dataDiario = {};
        let QUEENS = [];
        let COLORES = {};
        let APODOS = {};
        let REGALOS_IMGS_MAP = {};
        let AVATAR_IMGS_MAP = {};

        function hexToRgba(hex, alpha) {
            if (!hex) return `rgba(255, 238, 0, ${alpha})`;
            hex = hex.replace('#', '');
            if (hex.length === 3) {
                hex = hex.split('').map(char => char + char).join('');
            }
            const r = parseInt(hex.substring(0, 2), 16) || 0;
            const g = parseInt(hex.substring(2, 4), 16) || 0;
            const b = parseInt(hex.substring(4, 6), 16) || 0;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        let TITULOS = { semanal: 'RANKING SEMANAL', mensual: 'RANKING MENSUAL', diario: 'RANKING DEL DÍA' };
        let COLORES_TITULO = { semanal: '#ffffff', mensual: '#ffffff', diario: '#ffffff' };
        const CICLO = { semanal: 'mensual', mensual: 'diario', diario: 'semanal' };

        function parseCosmicColor(c) {
            if (!c || c.toLowerCase() === '#ffee00') return '#ffffff';
            return c;
        }

        function actualizarTituloUI() {
            const el = document.getElementById('titulo-ranking');
            if (!el) return;
            el.innerText = TITULOS[modo] || 'RANKING';
            const color = parseCosmicColor(COLORES_TITULO[modo]);
            el.style.color = color;
            el.style.textShadow = `2.5px 2.5px 0px #000, 0 0 10px ${hexToRgba(color, 0.7)}`;
        }

        function toggleModo() {
            modo = CICLO[modo];
            actualizarTituloUI();
            reordenarTabla();
            socket.emit('cambiarModoRanking', modo);
        }

        socket.on('modoRankingCambiado', (nuevoModo) => {
            if (nuevoModo && TITULOS[nuevoModo]) {
                modo = nuevoModo;
                actualizarTituloUI();
                reordenarTabla();
            }
        });

        function getDatos() {
            if (modo === 'mensual') return dataMensual;
            if (modo === 'diario') return dataDiario;
            return dataSemanal;
        }

        function crearFilas() {
            const container = document.getElementById('ranking-container');
            container.querySelectorAll('.row').forEach(r => r.remove());

            QUEENS.forEach(q => {
                const row = document.createElement('div');
                row.className = 'row';
                row.id = 'row-' + q;
                
                const nombreDisplay = APODOS[q] || q;
                const colorBase = COLORES[q] || '#00f2fe';
                
                row.innerHTML = `
                    <div class="row-left">
                        <span class="rank-num"></span>
                        <span class="out-badge" style="display: none;">OUT</span>
                        <div class="avatar-wrapper">
                            <img class="queen-avatar" src="" onload="this.style.display='block'; this.nextElementSibling.style.display='none';" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="queen-avatar-fallback" style="background: linear-gradient(135deg, ${colorBase}88, ${colorBase}); border: 2px solid ${colorBase};">
                                ${nombreDisplay.trim().charAt(0).toUpperCase()}
                            </div>
                        </div>
                        <span class="name"></span>
                    </div>
                    <span class="puntos" id="pts-${q}">0</span>
                `;
                container.appendChild(row);
            });
        }

        function reordenarTabla() {
            const datos = getDatos();
            const filas = QUEENS.map(q => ({
                name: q,
                pts: datos[q] || 0
            }));
            filas.sort((a, b) => b.pts - a.pts);

            filas.forEach((fila, index) => {
                const rowEl = document.getElementById('row-' + fila.name);
                const ptsEl = document.getElementById('pts-' + fila.name);
                if (!rowEl || !ptsEl) return;

                const nameEl = rowEl.querySelector('.name');
                const rankEl = rowEl.querySelector('.rank-num');
                const outEl = rowEl.querySelector('.out-badge');
                const imgEl = rowEl.querySelector('.queen-avatar');
                const fallbackEl = rowEl.querySelector('.queen-avatar-fallback');

                // 1. Order & Points
                rowEl.style.order = index;
                ptsEl.innerText = fila.pts.toLocaleString('es-ES');

                // 2. OUT State Check
                const isOut = fila.pts === 0;

                const nombreDisplay = APODOS[fila.name] || fila.name;
                const colorBase = COLORES[fila.name] || '#00f2fe';

                // 3. Apply Classes & Badges
                if (isOut) {
                    rowEl.classList.add('is-out');
                    rankEl.className = 'rank-num rank-out';
                    rankEl.innerText = index + 1;
                    outEl.style.display = 'inline-block';
                    nameEl.className = 'name name-out';
                    nameEl.style.color = ''; // let CSS handle it
                    nameEl.innerText = nombreDisplay;
                    ptsEl.className = 'puntos puntos-out';
                } else {
                    rowEl.classList.remove('is-out');
                    outEl.style.display = 'none';
                    ptsEl.className = 'puntos';

                    let rankClass = 'rank-other';
                    if (index === 0) rankClass = 'rank-1';
                    else if (index === 1) rankClass = 'rank-2';
                    else if (index === 2) rankClass = 'rank-3';

                    rankEl.className = 'rank-num ' + rankClass;
                    rankEl.innerText = index + 1;

                    if (index === 0) {
                        nameEl.innerHTML = '<span style="font-size:1.15rem; margin-right:4px;">🍭</span>' + nombreDisplay;
                        nameEl.className = 'name name-leader';
                        nameEl.style.color = '#ffee00';
                    } else {
                        nameEl.innerText = nombreDisplay;
                        nameEl.className = 'name';
                        nameEl.style.color = '#ffffff';
                    }
                }

                // 4. Update Avatar (prefers custom avatar_img, falls back to regalo_img, then to initials)
                const customAvatar = AVATAR_IMGS_MAP[fila.name] || '';
                const giftImg = REGALOS_IMGS_MAP[fila.name] || '';
                const avatarSrc = customAvatar || (giftImg ? `/regalos/${encodeURIComponent(giftImg)}` : '');
                
                if (avatarSrc) {
                    imgEl.src = avatarSrc;
                    // HTML event handlers (onload/onerror) toggle display dynamically
                } else {
                    imgEl.removeAttribute('src');
                    imgEl.style.display = 'none';
                    fallbackEl.style.display = 'flex';
                }
            });
        }

        // Carga inicial
        async function init() {
            try {
                const [resQ, resR, resM, resD, resAll, resAp, resTitulos] = await Promise.all([
                    fetch('/api/queens'),
                    fetch('/api/ranking'),
                    fetch('/api/ranking-mensual'),
                    fetch('/api/ranking-diario'),
                    fetch('/api/queens/all'),
                    fetch('/api/apodos'),
                    fetch('/api/ranking/titulos')
                ]);
                QUEENS = await resQ.json();
                dataSemanal = await resR.json();
                dataMensual = await resM.json();
                dataDiario  = await resD.json();
                const allQueens = await resAll.json();
                
                COLORES = {};
                REGALOS_IMGS_MAP = {};
                AVATAR_IMGS_MAP = {};
                allQueens.forEach(q => { 
                    COLORES[q.name] = q.color; 
                    REGALOS_IMGS_MAP[q.name] = q.regalo_img;
                    AVATAR_IMGS_MAP[q.name] = q.avatar_img || '';
                });
                
                APODOS = await resAp.json();

                if (resTitulos.ok) {
                    const titulosData = await resTitulos.json();
                    if (titulosData) {
                        if (titulosData.semanal) TITULOS.semanal = titulosData.semanal;
                        if (titulosData.mensual) TITULOS.mensual = titulosData.mensual;
                        if (titulosData.diario)  TITULOS.diario  = titulosData.diario;
                        if (titulosData.color_semanal) COLORES_TITULO.semanal = parseCosmicColor(titulosData.color_semanal);
                        if (titulosData.color_mensual) COLORES_TITULO.mensual = parseCosmicColor(titulosData.color_mensual);
                        if (titulosData.color_diario)  COLORES_TITULO.diario  = parseCosmicColor(titulosData.color_diario);
                    }
                }
                
                actualizarTituloUI();
                crearFilas();
                reordenarTabla();
            } catch(e) {
                console.log("Cargado sin datos previos", e);
            }
        }

        init();

        socket.on('rankingTitulosActualizados', (titulosData) => {
            if (titulosData) {
                if (titulosData.semanal) TITULOS.semanal = titulosData.semanal;
                if (titulosData.mensual) TITULOS.mensual = titulosData.mensual;
                if (titulosData.diario)  TITULOS.diario  = titulosData.diario;
                if (titulosData.color_semanal) COLORES_TITULO.semanal = parseCosmicColor(titulosData.color_semanal);
                if (titulosData.color_mensual) COLORES_TITULO.mensual = parseCosmicColor(titulosData.color_mensual);
                if (titulosData.color_diario)  COLORES_TITULO.diario  = parseCosmicColor(titulosData.color_diario);
                actualizarTituloUI();
            }
        });

        socket.on('rankingActualizado', () => {
            init();
        });

        socket.on('actualizarRanking', (data) => {
            dataSemanal[data.nombre] = data.puntosSemanal;
            dataMensual[data.nombre] = data.puntosMensual;
            if (data.puntosDiario !== undefined) dataDiario[data.nombre] = data.puntosDiario;

            const el = document.getElementById('pts-' + data.nombre);
            if (el) {
                el.classList.remove('update-anim');
                void el.offsetWidth;
                el.classList.add('update-anim');
            }
            reordenarTabla();
        });

        socket.on('resetRanking', () => {
            QUEENS.forEach(q => dataSemanal[q] = 0);
            reordenarTabla();
        });

        socket.on('resetMensual', () => {
            QUEENS.forEach(q => dataMensual[q] = 0);
            reordenarTabla();
        });

        socket.on('resetDiario', () => {
            QUEENS.forEach(q => dataDiario[q] = 0);
            reordenarTabla();
        });

        // Branding / Marca
        function loadGoogleFont(fontName) {
            const fontId = 'dynamic-google-font';
            let link = document.getElementById(fontId);
            if (!link) {
                link = document.createElement('link');
                link.id = fontId;
                link.rel = 'stylesheet';
                document.head.appendChild(link);
            }
            link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(fontName)}:wght@400;700;800;900&display=swap`;
            document.body.style.fontFamily = `'${fontName}', sans-serif`;
        }

        function aplicarMarca(config) {
            if (!config) return;
            if (config.fontFamily) {
                loadGoogleFont(config.fontFamily);
            }
        }
        socket.on('marcaCambiado', aplicarMarca);
        </script>
    </body>
</html>
