<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <!-- Inyección de multi-cuenta -->
    <script>
        (function () {
            const urlParams = new URLSearchParams(window.location.search);
            const user = urlParams.get('user');
            if (user) {
                const originalFetch = window.fetch;
                window.fetch = function (url, options) {
                    if (typeof url === 'string' && !url.includes('user=')) {
                        const sep = url.includes('?') ? '&' : '?';
                        url = url + sep + 'user=' + encodeURIComponent(user);
                    }
                    return originalFetch(url, options);
                };
                const originalIo = window.io;
                if (originalIo) {
                    window.io = function (opts) {
                        opts = opts || {};
                        opts.query = opts.query || {};
                        opts.query.user = user;
                        return originalIo(opts);
                    };
                } else {
                    let _io = undefined;
                    Object.defineProperty(window, 'io', {
                        get: function () { return _io; },
                        set: function (val) {
                            _io = function (opts) {
                                opts = opts || {};
                                opts.query = opts.query || {};
                                opts.query.user = user;
                                return val(opts);
                            };
                        },
                        configurable: true
                    });
                }
            }
        })();
    </script>

    <title>HUD Dinámica Activadores — TikDance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:ital,wght@0,300..900;1,300..900&family=Montserrat:ital,wght@0,600;0,800;0,900;1,700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'TikTok Sans', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
            user-select: none;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 35px;
        }

        /* ── CONTENEDOR PRINCIPAL HORIZONTAL (HUD) ── */
        #activadores-hud {
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            justify-content: center;
            gap: 15px;
            max-width: 98vw;
            position: relative;
            z-index: 10;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.6));
            transition: all 0.3s ease;
            min-height: 140px;
        }

        /* ── TARJETA INDIVIDUAL DE BAILARINA ── */
        .dancer-card {
            position: relative;
            width: 126px;
            min-width: 112px;
            max-width: 142px;
            background: rgba(36, 36, 43, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid rgba(255, 255, 255, 0.14);
            border-radius: 20px;
            padding: 34px 8px 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        border-color 0.4s ease,
                        background 0.4s ease,
                        box-shadow 0.4s ease;
        }

        /* ── ESTADO LÍDER / GANADORA (AMARILLO ACTIVO / GOLDEN GLOW) ── */
        .dancer-card.is-leader {
            border: 2.8px solid #FFD700 !important;
            background: linear-gradient(180deg, #6e4e04 0%, #423002 100%) !important;
            box-shadow: 0 0 24px rgba(255, 215, 0, 0.8),
                        0 0 45px rgba(255, 200, 0, 0.4),
                        inset 0 0 16px rgba(255, 215, 0, 0.35),
                        0 12px 32px rgba(0, 0, 0, 0.85) !important;
            transform: scale(1.06) translateY(-5px);
            z-index: 5;
        }

        .dancer-card.is-leader .gift-icon {
            filter: drop-shadow(0 0 14px rgba(255, 215, 0, 0.95)) drop-shadow(0 6px 12px rgba(0, 0, 0, 0.8)) !important;
        }

        /* Insignia o corona sutil para la líder */
        .leader-crown-badge {
            position: absolute;
            top: -46px;
            right: 12px;
            font-size: 20px;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.8));
            animation: crownBounce 2.2s infinite alternate ease-in-out;
            pointer-events: none;
            display: none;
        }

        .dancer-card.is-leader .leader-crown-badge {
            display: block;
        }

        @keyframes crownBounce {
            0% { transform: translateY(0) rotate(8deg); }
            100% { transform: translateY(-4px) rotate(16deg) scale(1.1); }
        }

        /* ── ÍCONO 3D DEL REGALO FLOTANTE ── */
        .gift-floating-box {
            position: absolute;
            top: -32px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 4;
        }

        .gift-icon {
            width: 58px;
            height: 58px;
            object-fit: contain;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.75));
            transition: transform 0.25s ease, filter 0.3s ease;
        }

        .gift-icon.bounce {
            animation: giftBounceAnim 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes giftBounceAnim {
            0% { transform: scale(1) rotate(0deg); }
            30% { transform: scale(1.45) rotate(-10deg); }
            60% { transform: scale(0.88) rotate(6deg); }
            80% { transform: scale(1.12) rotate(-3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* ── PÍLDORA DEL CONTADOR EN AMARILLO VIVO ── */
        .count-pill {
            background: rgba(14, 14, 18, 0.94);
            border-radius: 9999px;
            padding: 3px 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.7), 0 2px 6px rgba(0, 0, 0, 0.4);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 64px;
            transition: transform 0.2s ease;
        }

        .count-number {
            font-size: 21px;
            font-weight: 800 !important;
            color: #FFE600; /* Amarillo vivo idéntico al de la imagen */
            letter-spacing: 0.5px;
            line-height: 1.1;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
            text-align: center;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .count-number.pop {
            transform: scale(1.3);
            color: #FFFFFF;
        }

        /* ── NOMBRE DE LA BAILARINA ── */
        .dancer-name {
            font-size: 15px;
            font-weight: 700 !important;
            color: #FFFFFF;
            letter-spacing: 0.4px;
            text-align: center;
            line-height: 1.15;
            max-width: 95%;
            word-break: break-word;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95);
        }

        /* ── NOTIFICACIÓN FLOTANTE +DELTA AL RECIBIR REGALO ── */
        .floating-pts-tag {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            font-weight: 900 !important;
            color: #FFE600;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.95), 1px 1px 0 #000, -1px -1px 0 #000;
            pointer-events: none;
            z-index: 15;
            white-space: nowrap;
            animation: floatUpFade 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes floatUpFade {
            0% {
                opacity: 0;
                transform: translate(-50%, 8px) scale(0.6);
            }
            25% {
                opacity: 1;
                transform: translate(-50%, -4px) scale(1.25);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -32px) scale(1);
            }
        }
    </style>
</head>

<body>
    <div id="activadores-hud">
        <!-- Generado dinámicamente con las tarjetas de bailarinas -->
    </div>

    <script src="/js/iframe-bridge.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let userParam = urlParams.get('user') || '';
        if (!userParam) {
            const pathParts = window.location.pathname.split('/').filter(Boolean);
            if (pathParts.length > 0 && !pathParts[0].includes('activadores') && !pathParts[0].includes('overlay')) {
                userParam = pathParts[0];
            }
        }

        const socket = window.__iframeBridgeSocket || io({ query: userParam ? { user: userParam } : {} });

        let participantes = [];
        let conteos = {};
        let equipos = {};
        let lider = null;

        const hudContainer = document.getElementById('activadores-hud');

        function resolverImagenRegalo(rawImg) {
            if (!rawImg) return '/regalos/Rosa.png';
            if (rawImg.startsWith('/') || rawImg.startsWith('http')) return rawImg;
            return '/regalos/' + rawImg;
        }

        function renderCards() {
            hudContainer.innerHTML = '';
            if (!participantes || participantes.length === 0) {
                hudContainer.innerHTML = `
                    <div style="background: rgba(30,30,38,0.88); border: 1.5px solid rgba(255,255,255,0.18); border-radius: 9999px; padding: 12px 26px; color: #fff; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.6);">
                        <span style="font-size: 20px;">⚡</span> Esperando bailarinas activas...
                    </div>
                `;
                return;
            }

            participantes.forEach(chica => {
                const eq = equipos[chica] || { nombre: chica, regalo_img: '' };
                const count = conteos[chica] || 0;
                const isLider = (lider && lider.toLowerCase() === chica.toLowerCase() && count > 0);
                const imgSrc = resolverImagenRegalo(eq.regalo_img);

                const card = document.createElement('div');
                card.className = 'dancer-card' + (isLider ? ' is-leader' : '');
                card.id = 'card-' + sanitizeId(chica);

                card.innerHTML = `
                    <div class="leader-crown-badge">👑</div>
                    <div class="gift-floating-box">
                        <img class="gift-icon" id="gift-icon-${sanitizeId(chica)}" src="${imgSrc}" alt="${chica}" onerror="this.src='/regalos/Rosa.png'">
                    </div>
                    <div class="count-pill">
                        <span class="count-number" id="count-${sanitizeId(chica)}">${count}</span>
                    </div>
                    <span class="dancer-name">${eq.nombre || chica}</span>
                `;

                hudContainer.appendChild(card);
            });
        }

        function sanitizeId(str) {
            return String(str).replace(/[^a-zA-Z0-9_-]/g, '_');
        }

        function updateCard(chica, nuevoConteo, delta) {
            const safeId = sanitizeId(chica);
            const countEl = document.getElementById('count-' + safeId);
            const cardEl = document.getElementById('card-' + safeId);
            const iconEl = document.getElementById('gift-icon-' + safeId);

            if (!cardEl) {
                cargarEstado();
                return;
            }

            conteos[chica] = nuevoConteo;

            if (countEl) {
                countEl.textContent = nuevoConteo;
                countEl.classList.add('pop');
                setTimeout(() => countEl.classList.remove('pop'), 260);
            }

            if (iconEl && delta > 0) {
                iconEl.classList.remove('bounce');
                void iconEl.offsetWidth; // Forzar reflow para reiniciar animación
                iconEl.classList.add('bounce');
            }

            // Notificación flotante +delta
            if (delta > 0) {
                mostrarTagFlotante(cardEl, '+' + delta);
            }

            // Actualizar líderes en todas las tarjetas
            actualizarLiderVisual();
        }

        function mostrarTagFlotante(parentEl, texto) {
            const tag = document.createElement('div');
            tag.className = 'floating-pts-tag';
            tag.textContent = texto;
            parentEl.appendChild(tag);
            setTimeout(() => {
                if (tag.parentNode) tag.parentNode.removeChild(tag);
            }, 900);
        }

        function actualizarLiderVisual() {
            let max = 0;
            let currentLeader = null;

            participantes.forEach(p => {
                const c = conteos[p] || 0;
                if (c > max) {
                    max = c;
                    currentLeader = p;
                }
            });

            lider = (max > 0) ? currentLeader : null;

            participantes.forEach(chica => {
                const card = document.getElementById('card-' + sanitizeId(chica));
                if (card) {
                    if (lider && lider.toLowerCase() === chica.toLowerCase() && (conteos[chica] || 0) > 0) {
                        card.classList.add('is-leader');
                    } else {
                        card.classList.remove('is-leader');
                    }
                }
            });
        }

        async function cargarEstado() {
            try {
                let url = '/api/activadores/estado';
                if (userParam && !url.includes('user=')) {
                    url += `?user=${encodeURIComponent(userParam)}`;
                }
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    participantes = data.participantes || [];
                    conteos = data.conteos || {};
                    equipos = data.equipos || {};
                    lider = data.lider || null;
                    renderCards();

                    if (participantes.length === 0) {
                        setTimeout(cargarEstado, 1200);
                    }
                }
            } catch (e) {
                console.error('Error cargando estado de activadores:', e);
            }
        }

        // ── SOCKET.IO LISTENERS ──
        socket.on('activadoresEstado', (data) => {
            if (!data) return;
            participantes = data.participantes || [];
            conteos = data.conteos || {};
            equipos = data.equipos || {};
            lider = data.lider || null;
            renderCards();
        });

        socket.on('activadoresUpdate', (data) => {
            if (!data) return;
            if (data.conteos) conteos = data.conteos;
            if (data.lider !== undefined) lider = data.lider;
            if (data.chica) {
                updateCard(data.chica, data.conteo !== undefined ? data.conteo : (conteos[data.chica] || 0), data.delta || 0);
            } else {
                actualizarLiderVisual();
            }
        });

        socket.on('activadoresReset', (data) => {
            if (data && data.conteos) {
                conteos = data.conteos;
            } else {
                participantes.forEach(p => conteos[p] = 0);
            }
            lider = null;
            renderCards();
        });

        socket.on('queensActualizadas', () => {
            cargarEstado();
        });

        // Cargar estado inicial
        cargarEstado();
    </script>
</body>

</html>
