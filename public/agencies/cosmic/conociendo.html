    <!-- Inyección de multi-cuenta -->
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const user = urlParams.get('user');
            if (user) {
                const originalFetch = window.fetch;
                window.fetch = function(url, options) {
                    if (typeof url === 'string' && !url.includes('user=')) {
                        const sep = url.includes('?') ? '&' : '?';
                        url = url + sep + 'user=' + encodeURIComponent(user);
                    }
                    return originalFetch(url, options);
                };
                const originalIo = window.io;
                if (originalIo) {
                    window.io = function(opts) {
                        opts = opts || {};
                        opts.query = opts.query || {};
                        opts.query.user = user;
                        return originalIo(opts);
                    };
                } else {
                    let _io = undefined;
                    Object.defineProperty(window, 'io', {
                        get: function() { return _io; },
                        set: function(val) {
                            _io = function(opts) {
                                opts = opts || {};
                                opts.query = opts.query || {};
                                opts.query.user = user;
                                return val(opts);
                            };
                        },
                        configurable: true
                    });
                }
            }
        })();
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background: transparent;
            color: white;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 28px 20px;
            min-height: 100vh;
        }

        body.neon-none * { text-shadow: none !important; box-shadow: none !important; }
        body.neon-low *  { text-shadow: 0 0 3px currentColor !important; }

        .timer-container { display: none; justify-content: center; align-items: flex-start; }
        .timer-activo    { display: flex; }

        /* ═══ BANNER PRINCIPAL ═══ */
        .caja-central {
            position: relative;
            width: 700px;
            max-width: 96vw;
            min-height: 180px;
            border-radius: 32px;
            background:
                radial-gradient(ellipse 55% 80% at 50% 45%, rgba(180,60,220,0.38) 0%, transparent 70%),
                linear-gradient(105deg, #18043a 0%, #5b1a9a 38%, #b91fcc 72%, #8b10a8 100%);
            border: 2.5px solid rgba(220,160,255,0.55);
            box-shadow:
                0 8px 40px rgba(0,0,0,0.85),
                0 0 50px rgba(180,60,240,0.45),
                inset 0 0 35px rgba(160,50,220,0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: visible;
            transition: box-shadow 0.5s ease, border-color 0.5s ease;
        }
        /* Dot grid texture */
        .caja-central::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 32px;
            background: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px) 0 0 / 18px 18px;
            pointer-events: none;
            z-index: 0;
        }

        /* ═══ NOMBRE PILL ═══ */
        .title-pill {
            position: absolute;
            top: -17px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            border-radius: 20px;
            padding: 5px 26px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.45), 0 0 20px rgba(255,255,255,0.75);
            font-weight: 900;
            font-size: 15px;
            color: #2e0854;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            z-index: 20;
        }
        .title-pill .sparkle { color: #a855f7; font-size: 13px; }

        /* ═══ SPARKLES LATERALES ═══ */
        .sparkles-left, .sparkles-right {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 68px;
            height: 120px;
            pointer-events: none;
            z-index: 5;
        }
        .sparkles-left  { left:  -12px; }
        .sparkles-right { right: -12px; transform: translateY(-50%) scaleX(-1); }
        .sparkle-star { position: absolute; opacity: 0; }
        .sparkle-star svg { display: block; }
        @keyframes sparkFade {
            0%   { opacity: 0;   transform: scale(0.4) rotate(0deg); }
            30%  { opacity: 1;   transform: scale(1)   rotate(15deg); }
            70%  { opacity: 0.8; transform: scale(0.9) rotate(30deg); }
            100% { opacity: 0;   transform: scale(0.3) rotate(45deg); }
        }
        .s1 { top:  8%; left: 20%; animation: sparkFade 2.1s 1.0s infinite; }
        .s2 { top: 35%; left: 55%; animation: sparkFade 1.8s 0.3s infinite; }
        .s3 { top: 62%; left: 10%; animation: sparkFade 2.4s 1.5s infinite; }
        .s4 { top: 80%; left: 45%; animation: sparkFade 1.6s 0.8s infinite; }
        .s5 { top: 20%; left: 72%; animation: sparkFade 2.0s 2.1s infinite; }

        /* ═══ HEX TIMER — anillos concéntricos mejorados ═══ */
        @keyframes hexPulse {
            0%, 100% { opacity: 0.45; transform: scale(1); }
            50%       { opacity: 0.80; transform: scale(1.04); }
        }
        @keyframes hexGlow {
            0%, 100% { filter: blur(6px) brightness(1); }
            50%       { filter: blur(10px) brightness(1.5); }
        }

        .hex-wrap {
            position: relative;
            width: 230px;
            height: 206px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Aura difusa externa — glow ambiental detrás de todo */
        .hex-aura {
            position: absolute;
            width: 240px;
            height: 216px;
            border-radius: 50%;
            background: radial-gradient(ellipse, rgba(168,85,247,0.55) 0%, transparent 70%);
            filter: blur(18px);
            animation: hexPulse 2.8s ease-in-out infinite;
            z-index: 0;
        }

        .hex-ring {
            position: absolute;
            clip-path: polygon(25% 5%, 75% 5%, 98% 50%, 75% 95%, 25% 95%, 2% 50%);
            z-index: 1;
        }

        /* Anillo exterior — brillo difuso */
        .hex-ring-3 {
            width: 230px;
            height: 206px;
            background: linear-gradient(135deg, rgba(220,130,255,0.30), rgba(180,60,255,0.18));
            filter: blur(3px);
            animation: hexGlow 2.8s ease-in-out infinite;
        }
        /* Anillo medio — borde semitransparente */
        .hex-ring-2 {
            width: 200px;
            height: 180px;
            background: linear-gradient(135deg, rgba(255,200,255,0.55), rgba(200,100,255,0.40));
        }
        /* Anillo interior — borde brillante blanco-lila */
        .hex-ring-1 {
            width: 174px;
            height: 156px;
            background: linear-gradient(145deg, #ffffff 0%, #e0b4ff 40%, #b060f0 100%);
            box-shadow: 0 0 22px rgba(200,100,255,0.7), 0 0 8px rgba(255,255,255,0.5);
        }

        .hex-inner {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            clip-path: polygon(25% 5%, 75% 5%, 98% 50%, 75% 95%, 25% 95%, 2% 50%);
            background:
                radial-gradient(circle at 38% 30%, #a855f7 0%, #6b21a8 35%, #3b0764 70%, #1a0038 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Reflejo interno superior (luz especular) */
        .hex-inner::before {
            content: '';
            position: absolute;
            top: 12%;
            left: 22%;
            width: 56%;
            height: 28%;
            background: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, transparent 100%);
            clip-path: polygon(10% 0%, 90% 0%, 80% 100%, 20% 100%);
            border-radius: 4px;
        }

        .reloj {
            position: relative;
            z-index: 3;
            font-size: 48px;
            font-weight: 900;
            color: #fff;
            text-shadow:
                0 0 25px rgba(255,255,255,1),

            line-height: 1;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .reloj-gracias {
            font-size: 28px !important;
            font-weight: 900 !important;
            letter-spacing: 1px !important;
            color: #ffffff !important;
            text-align: center;
            white-space: nowrap;
            display: inline-block;
            animation: pulseGracias 2s ease-in-out infinite !important;
        }

        @keyframes pulseGracias {
            0%, 100% {
                transform: scale(1);
                text-shadow:
                    0 0 10px #ffffff,
                    0 0 22px var(--color-reloj-gracias, #a855f7),
                    0 0 35px var(--color-reloj-gracias, #a855f7),
                    2px 3px 6px rgba(0,0,0,0.9);
            }
            50% {
                transform: scale(1.05);
                text-shadow:
                    0 0 16px #ffffff,
                    0 0 32px var(--color-reloj-gracias, #a855f7),
                    0 0 50px var(--color-reloj-gracias, #a855f7),
                    0 0 65px #ffffff,
                    2px 3px 6px rgba(0,0,0,0.9);
            }
        }

        /* ═══ CONTENT ROW ═══ */
        .banner-content {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 26px 32px 10px 28px;
            gap: 16px;
        }

        /* Glow orb decorativo derecho */
        .banner-right-deco {
            flex: 1;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        .glow-orb {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(220,100,255,0.55) 0%, rgba(180,60,255,0.2) 50%, transparent 75%);
            filter: blur(8px);
            animation: orbPulse 3s ease-in-out infinite;
        }
        @keyframes orbPulse {
            0%, 100% { transform: scale(1);    opacity: 0.7; }
            50%       { transform: scale(1.15); opacity: 1; }
        }

        /* ═══ BARRA INFERIOR ═══ */
        .bar-container {
            position: relative;
            z-index: 1;
            width: calc(100% + 5px);
            margin-left: -2.5px;
            margin-right: -2.5px;
            height: 42px;
            background: rgba(8,2,18,0.8);
            border-radius: 0 0 30px 30px;
            border-top: 1.5px solid rgba(255,255,255,0.12);
            overflow: hidden;
        }
        .bar-fill {
            position: absolute;
            left: 0; top: 0;
            height: 100%;
            width: 0%;
            transition: width 0.55s cubic-bezier(0.25,1,0.5,1);
            background: linear-gradient(90deg, rgba(168,85,247,0.35) 0%, rgba(219,120,255,0.25) 100%);
            border-radius: 0 0 30px 30px;
        }
        .bar-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
            pointer-events: none;
        }
        .pts-badge {
            background: rgba(255,255,255,0.92);
            color: #1e053a;
            font-weight: 900;
            font-size: 15px;
            padding: 2px 14px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.45);

        }
        .meta-target {

            letter-spacing: 1px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.9), 0 0 10px rgba(200,100,255,0.6);
        }

        .parpadeo { animation: parpadeoAnim 0.8s infinite alternate; }
        @keyframes parpadeoAnim { from { opacity: 1; } to { opacity: 0.35; } }
    </style>
</head>

    <script>
        const socket = window.__iframeBridgeSocket || io();
        let QUEEN_COLORS = {};
        let APODOS = {};
        const contenedor = document.getElementById('contenedor-principal');
        const cajaReloj = document.getElementById('caja-reloj');
        const displayReloj = document.getElementById('timer-display');
        const nombreBailando = document.getElementById('nombre-bailando');
        const barraMeta = document.getElementById('barra-meta');
        const txtPuntos = document.getElementById('puntos-actuales');
        const txtMeta = document.getElementById('meta-total');
        const cajaTransicion = document.getElementById('caja-transicion');
        const countdownTransicion = document.getElementById('countdown-transicion');

        fetch('/api/queens/all').then(r => r.json()).then(all => {
            all.forEach(q => { QUEEN_COLORS[q.name] = q.color; });
        });
        fetch('/api/apodos').then(r => r.json()).then(map => { APODOS = map; });

        socket.on('queensActualizadas', (data) => {
            if (data.equipos) Object.keys(data.equipos).forEach(n => { QUEEN_COLORS[n] = data.equipos[n].color; });
            if (data.apodos) APODOS = data.apodos;
        });

        function lighten(hex) {
            try {
                let r = Math.min(255, parseInt(hex.slice(1,3),16)+60);
                let g = Math.min(255, parseInt(hex.slice(3,5),16)+60);
                let b = Math.min(255, parseInt(hex.slice(5,7),16)+60);
                return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
            } catch(e) { return hex || '#a855f7'; }
        }

        function formatearTiempo(segundos) {
            let m = Math.floor(segundos / 60).toString().padStart(2, '0');
            let s = (segundos % 60).toString().padStart(2, '0');
            return m + ':' + s;
        }

        function aplicarColoresChica(chica) {
            const color = QUEEN_COLORS[chica] || '#a855f7';
            const light = lighten(color);
            document.documentElement.style.setProperty('--color-reloj-gracias', color);
            nombreBailando.innerText = (APODOS[chica] || chica).toUpperCase();
            cajaReloj.style.borderColor = color + '80';
            cajaReloj.style.boxShadow = `0 15px 45px rgba(0, 0, 0, 0.8), 0 0 35px ${color}66`;
            cajaTransicion.style.borderColor = color + '80';
            cajaTransicion.style.boxShadow = `0 15px 45px rgba(0, 0, 0, 0.8), 0 0 35px ${color}66`;
            barraMeta.style.background = `linear-gradient(90deg, ${color}, ${light})`;
        }

        function actualizarRelojDisplay(segundos) {
            if (segundos <= 0) {
                displayReloj.innerText = '¡GRACIAS!';
                displayReloj.classList.add('reloj-gracias');
            } else {
                displayReloj.innerText = formatearTiempo(segundos);
                displayReloj.classList.remove('reloj-gracias');
            }
        }

        socket.on('conociendoInicio', (data) => {
            cajaTransicion.style.display = 'none';
            cajaReloj.style.display = 'flex';
            contenedor.classList.add('timer-activo');
            aplicarColoresChica(data.chica);
            actualizarRelojDisplay(data.tiempo);
            txtMeta.innerText = data.meta.toLocaleString();
            actualizarBarra(data.puntos, data.meta);
        });

        socket.on('conociendoTick', (tiempo) => { actualizarRelojDisplay(tiempo); });

        socket.on('conociendoPuntos', (data) => { actualizarBarra(data.puntos, data.meta); });

        socket.on('conociendoTransicion', (data) => {
            cajaReloj.style.display = 'none';
            cajaTransicion.style.display = 'flex';
            contenedor.classList.add('timer-activo');
            const apodo = (APODOS[data.chica] || data.chica).toUpperCase();
            const el = document.getElementById('transicion-nombre');
            if (el) el.innerText = '¡SIGUIENTE: ' + apodo + '!';
            countdownTransicion.innerText = data.tiempo;
            aplicarColoresChica(data.chica); 
        });

        socket.on('conociendoTransicionTick', (tiempo) => { countdownTransicion.innerText = tiempo; });
        
        socket.on('conociendoCancelado', () => { 
            contenedor.classList.remove('timer-activo'); 
            cajaReloj.style.display = 'none';
            cajaTransicion.style.display = 'none';
        });

        function actualizarBarra(puntos, meta) {
            txtPuntos.innerText = puntos.toLocaleString();
            let porcentaje = meta === 0 ? 0 : (puntos / meta) * 100;
            if(porcentaje > 100) porcentaje = 100;
            barraMeta.style.width = porcentaje + '%';
        }

        // ── BRAND MANAGER LOGIC ──
        function loadGoogleFont(fontName) {
            if (!fontName) return;
            const fontId = 'custom-google-font';
            let link = document.getElementById(fontId);
            if (!link) {
                link = document.createElement('link');
                link.id = fontId;
                link.rel = 'stylesheet';
                document.head.appendChild(link);
            }
            link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(fontName)}:wght@400;700;800;900&display=swap`;
            document.body.style.fontFamily = `'${fontName}', sans-serif`;
        }

        function aplicarMarca(config) {
            if (!config) return;
            if (config.fontFamily) {
                loadGoogleFont(config.fontFamily);
            }
            const logoContainer = document.getElementById('agency-logo-container');
            const logoImg = document.getElementById('agency-logo');
            if (logoContainer && logoImg) {
                if (config.logoUrl) {
                    logoImg.src = config.logoUrl;
                    logoContainer.style.opacity = '1';
                    logoContainer.style.transform = 'scale(1)';
                } else {
                    logoContainer.style.opacity = '0';
                    logoContainer.style.transform = 'scale(0.8)';
                }
            }
            document.body.classList.remove('neon-none', 'neon-low', 'neon-high');
            if (config.neonIntensity && config.neonIntensity !== 'normal') {
                document.body.classList.add('neon-' + config.neonIntensity);
            }
        }

        socket.on('marcaCambiado', aplicarMarca);
    </script>

    <!-- Logotipo de la Agencia Flotante -->
    <div id="agency-logo-container" style="position: absolute; top: 20px; right: 20px; z-index: 9999; pointer-events: none; transition: all 0.5s ease; opacity: 0; transform: scale(0.8);">
        <img id="agency-logo" src="" style="max-height: 80px; max-width: 150px; object-fit: contain; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));">
    </div>
</body>
</html>
