    <!-- Inyección de multi-cuenta para TikDance (Agencia Cosmic) -->
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const user = urlParams.get('user');
            if (user) {
                const originalFetch = window.fetch;
                window.fetch = function(url, options) {
                    if (typeof url === 'string' && !url.includes('user=')) {
                        const sep = url.includes('?') ? '&' : '?';
                        url = url + sep + 'user=' + encodeURIComponent(user);
                    }
                    return originalFetch(url, options);
                };
                const originalIo = window.io;
                if (originalIo) {
                    window.io = function(opts) {
                        opts = opts || {};
                        opts.query = opts.query || {};
                        opts.query.user = user;
                        return originalIo(opts);
                    };
                } else {
                    let _io = undefined;
                    Object.defineProperty(window, 'io', {
                        get: function() { return _io; },
                        set: function(val) {
                            _io = function(opts) {
                                opts = opts || {};
                                opts.query = opts.query || {};
                                opts.query.user = user;
                                return val(opts);
                            };
                        },
                        configurable: true
                    });
                }
            }
        })();
    </script>

    <!-- PUENTE IFRAME Y SOCKET.IO DE TIKDANCE -->
    <script src="/js/iframe-bridge.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        function formatLikes(num) {
            if (!num || isNaN(num)) return '0';
            if (num >= 1000000) return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
            return num.toString();
        }

        const urlParams = new URLSearchParams(window.location.search);
        const userParam = urlParams.get('user') || '';
        const isTestMode = urlParams.get('test') === 'true';

        let isUsingDemoData = !isTestMode;
        let tappersData = [];
        let lastLeaderId = null;

        const demoData = [
            { uniqueId: 'eclonyx', nickname: 'ECLONYX', profilePictureUrl: '', likes: 14500, streak: 7, coins: 3 },
            { uniqueId: 'queendancer', nickname: 'Sofia Queen 👑', profilePictureUrl: '', likes: 9800, streak: 5, coins: 2 },
            { uniqueId: 'alex_tapper', nickname: 'Alex VIP ✨', profilePictureUrl: '', likes: 6200, streak: 3, coins: 1 },
            { uniqueId: 'carlos_live', nickname: 'Carlos R. ⚡', profilePictureUrl: '', likes: 3400, streak: 2, coins: 1 },
            { uniqueId: 'spooky_fan', nickname: 'Spooky Fan 🎃', profilePictureUrl: '', likes: 1900, streak: 1, coins: 1 }
        ];

        if (isUsingDemoData) {
            tappersData = JSON.parse(JSON.stringify(demoData));
        }

        const heroMvpCardEl = document.getElementById('heroMvpCard');
        const mvpNameEl = document.getElementById('mvpName');
        const mvpAvatarImgEl = document.getElementById('mvpAvatarImg');
        const mvpAvatarFallbackEl = document.getElementById('mvpAvatarFallback');
        const mvpStreakEl = document.getElementById('mvpStreak');
        const mvpLikesEl = document.getElementById('mvpLikes');
        const runnersListEl = document.getElementById('runnersList');
        const liveStatusEl = document.getElementById('liveStatus');

        function showMvpImg() {
            mvpAvatarImgEl.style.display = 'block';
            mvpAvatarFallbackEl.style.display = 'none';
        }

        function showMvpFallback() {
            mvpAvatarImgEl.style.display = 'none';
            mvpAvatarFallbackEl.style.display = 'flex';
        }

        function renderTop5() {
            tappersData.sort((a, b) => b.likes - a.likes);

            if (tappersData.length > 0) {
                const mvp = tappersData[0];

                if (lastLeaderId !== mvp.uniqueId) {
                    if (lastLeaderId !== null) {
                        heroMvpCardEl.classList.remove('new-mvp-crown');
                        void heroMvpCardEl.offsetWidth;
                        heroMvpCardEl.classList.add('new-mvp-crown');
                    }
                    lastLeaderId = mvp.uniqueId;
                }

                mvpNameEl.textContent = (mvp.nickname || mvp.uniqueId || 'LÍDER').toUpperCase();
                mvpStreakEl.textContent = mvp.streak || Math.max(1, Math.min(99, Math.floor(mvp.likes / 500) || 1));
                mvpLikesEl.textContent = formatLikes(mvp.likes);

                const initial = (mvp.nickname || mvp.uniqueId || '👑').trim().charAt(0).toUpperCase();
                mvpAvatarFallbackEl.textContent = initial;

                if (mvp.profilePictureUrl && mvp.profilePictureUrl.trim().length > 0) {
                    mvpAvatarImgEl.src = mvp.profilePictureUrl;
                } else {
                    showMvpFallback();
                }
            } else {
                mvpNameEl.textContent = 'ESPERANDO TAPS...';
                mvpStreakEl.textContent = '0';
                mvpLikesEl.textContent = '0';
                mvpAvatarFallbackEl.textContent = '🎃';
                showMvpFallback();
            }

            runnersListEl.innerHTML = '';
            for (let i = 1; i < 5; i++) {
                const rank = i + 1;
                const user = tappersData[i];

                const row = document.createElement('div');
                row.className = `tapper-row rank-${rank}`;

                if (user) {
                    row.id = `row-${user.uniqueId}`;
                    const initial = (user.nickname || user.uniqueId || '?').trim().charAt(0).toUpperCase();
                    const medalClass = rank === 2 ? 'medal-2' : (rank === 3 ? 'medal-3' : '');

                    const avatarHTML = user.profilePictureUrl ?
                        `<img src="${user.profilePictureUrl}" class="mini-avatar-img" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'mini-avatar-fallback\\'>${initial}</div>';" />` :
                        `<div class="mini-avatar-fallback">${initial}</div>`;

                    row.innerHTML = `
                        <div class="row-left">
                            <div class="mini-rank-medal ${medalClass}">#${rank}</div>
                            <div class="mini-avatar-wrapper">${avatarHTML}</div>
                            <div class="row-names">
                                <span class="row-name">${user.nickname || user.uniqueId}</span>
                                <span class="row-sub">@${user.uniqueId}</span>
                            </div>
                        </div>
                        <div class="row-right" id="pts-${user.uniqueId}">
                            <span class="row-heart">❤️</span>
                            <span>${formatLikes(user.likes)}</span>
                        </div>
                    `;
                } else {
                    row.classList.add('empty-slot');
                    row.innerHTML = `
                        <div class="row-left">
                            <div class="mini-rank-medal">#${rank}</div>
                            <span class="empty-slot-text">👆 Da tap tap para entrar al #${rank}</span>
                        </div>
                        <div class="row-right">
                            <span style="opacity: 0.3;">--</span>
                        </div>
                    `;
                }

                runnersListEl.appendChild(row);
            }
        }

        function triggerPulse(uniqueId, isMvp) {
            if (isMvp) {
                mvpLikesEl.classList.remove('tap-pulse');
                void mvpLikesEl.offsetWidth;
                mvpLikesEl.classList.add('tap-pulse');
            } else {
                const rowPts = document.getElementById(`pts-${uniqueId}`);
                if (rowPts) {
                    rowPts.classList.remove('tap-pulse');
                    void rowPts.offsetWidth;
                    rowPts.classList.add('tap-pulse');
                }
            }
        }

        function processLiveLike(uniqueId, nickname, profilePictureUrl, totalLikesSent, increment = 1) {
            if (!uniqueId) return;

            if (isUsingDemoData) {
                isUsingDemoData = false;
                tappersData = [];
                liveStatusEl.textContent = '🟢 RECIBIENDO TAPS EN VIVO';
            }

            let user = tappersData.find(u => u.uniqueId === uniqueId);
            const likesAmount = typeof increment === 'number' && increment > 0 ? increment : 1;

            if (user) {
                if (totalLikesSent && totalLikesSent > user.likes) {
                    user.likes = totalLikesSent;
                } else {
                    user.likes += likesAmount;
                }
                user.streak = (user.streak || 1) + 1;
                if (nickname) user.nickname = nickname;
                if (profilePictureUrl) user.profilePictureUrl = profilePictureUrl;
            } else {
                user = {
                    uniqueId: uniqueId,
                    nickname: nickname || uniqueId,
                    profilePictureUrl: profilePictureUrl || '',
                    likes: totalLikesSent || likesAmount,
                    streak: 1,
                    coins: 1
                };
                tappersData.push(user);
            }

            renderTop5();
            const isMvp = tappersData.length > 0 && tappersData[0].uniqueId === uniqueId;
            triggerPulse(uniqueId, isMvp);
        }

        renderTop5();

        const socket = window.__iframeBridgeSocket || (typeof io !== 'undefined' ? io({ query: userParam ? { user: userParam } : {} }) : null);

        if (socket) {
            socket.on('tiktokLiveEvent', (event) => {
                if (!event) return;
                if (event.tipo === 'like') {
                    processLiveLike(
                        event.usuario || event.uniqueId,
                        event.nickname || event.name,
                        event.avatar || event.profilePictureUrl,
                        event.totalLikeCount || event.totalLikes,
                        event.cantidad || event.likeCount || 1
                    );
                }
            });

            socket.on('like', (data) => {
                if (!data) return;
                processLiveLike(
                    data.uniqueId || data.usuario,
                    data.nickname || data.name,
                    data.profilePictureUrl || data.avatar,
                    data.totalLikeCount,
                    data.likeCount || data.cantidad || 1
                );
            });

            socket.on('tiktokEstado', (data) => {
                if (!data) return;
                if (data.estado === 'conectado') {
                    liveStatusEl.textContent = `🟢 LIVE DE @${(data.usuario || '').toUpperCase()}`;
                    liveStatusEl.style.color = '#00e676';
                } else if (data.estado === 'conectando') {
                    liveStatusEl.textContent = `🟡 CONECTANDO A TIKTOK...`;
                    liveStatusEl.style.color = '#ffee00';
                } else if (data.estado === 'error') {
                    liveStatusEl.textContent = `⚠️ ERROR DE CONEXIÓN`;
                    liveStatusEl.style.color = '#ff5252';
                } else if (data.estado === 'desconectado') {
                    liveStatusEl.textContent = `🔴 ESPERANDO CONEXIÓN A LIVE`;
                    liveStatusEl.style.color = '#ff5252';
                }
            });
        }

        window.addEventListener('message', (event) => {
            if (!event.data) return;
            const d = event.data;
            if (d.event === 'tiktokLiveEvent' || d.type === 'tiktokLiveEvent') {
                const payload = d.data || d;
                if (payload.tipo === 'like') {
                    processLiveLike(
                        payload.usuario || payload.uniqueId,
                        payload.nickname || payload.name,
                        payload.avatar || payload.profilePictureUrl,
                        payload.totalLikeCount,
                        payload.cantidad || payload.likeCount || 1
                    );
                }
            }
        });

        if (isTestMode) {
            isUsingDemoData = false;
            tappersData = JSON.parse(JSON.stringify(demoData));
            liveStatusEl.textContent = '⚠️ MODO PRUEBA ACTIVO (TECLA T PARA TAPS)';
            renderTop5();
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 't' || e.key === 'T') {
                isUsingDemoData = false;
                const testUsers = [
                    { id: 'eclonyx', name: 'ECLONYX' },
                    { id: 'queendancer', name: 'Sofia Queen 👑' },
                    { id: 'alex_tapper', name: 'Alex VIP ✨' },
                    { id: 'carlos_live', name: 'Carlos R. ⚡' },
                    { id: 'spooky_fan', name: 'Spooky Fan 🎃' },
                    { id: 'new_challenger', name: 'Nuevo Fan 🔥' }
                ];
                const selected = testUsers[Math.floor(Math.random() * testUsers.length)];
                processLiveLike(selected.id, selected.name, '', 0, Math.floor(Math.random() * 85) + 15);
            }
        });
    </script>
</body>
</html>
