    <!-- Inyección de multi-cuenta para TikDance (Agencia Cosmic) -->
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const user = urlParams.get('user');
            if (user) {
                const originalFetch = window.fetch;
                window.fetch = function(url, options) {
                    if (typeof url === 'string' && !url.includes('user=')) {
                        const sep = url.includes('?') ? '&' : '?';
                        url = url + sep + 'user=' + encodeURIComponent(user);
                    }
                    return originalFetch(url, options);
                };
                const originalIo = window.io;
                if (originalIo) {
                    window.io = function(opts) {
                        opts = opts || {};
                        opts.query = opts.query || {};
                        opts.query.user = user;
                        return originalIo(opts);
                    };
                } else {
                    let _io = undefined;
                    Object.defineProperty(window, 'io', {
                        get: function() { return _io; },
                        set: function(val) {
                            _io = function(opts) {
                                opts = opts || {};
                                opts.query = opts.query || {};
                                opts.query.user = user;
                                return val(opts);
                            };
                        },
                        configurable: true
                    });
                }
            }
        })();
    </script>

        .snowfall-layer {
            position: absolute;
            inset: 2px;
            border-radius: 20px;
            overflow: hidden;
            pointer-events: none;
            z-index: 7;
        }

        .snowflake-drop {

            top: -18px;
            color: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            will-change: transform, opacity;
            animation: snowFallAnim linear infinite;

            font-size: 10px;
            line-height: 1;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
        }

        @keyframes snowFallAnim {
            0% {
                transform: translate3d(0, -15px, 0) rotate(0deg);
                opacity: 0;
            }
            12% {
                opacity: var(--flake-opacity, 0.85);
            }
            50% {
                transform: translate3d(var(--flake-sway, 14px), 175px, 0) rotate(180deg);
            }
            88% {
                opacity: var(--flake-opacity, 0.85);
            }
            100% {
                transform: translate3d(calc(var(--flake-sway, 14px) * -0.6), 360px, 0) rotate(360deg);
                opacity: 0;
            }
        }

        .hero-tapper-info {

            white-space: nowrap;

            text-overflow: ellipsis;

        .rank-1 .tapper-name {

        .metrics-row {
            display: flex;
            align-items: center;
            gap: 13px;

            display: inline-flex;

        }

            width: 18px;

            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));

        .stat-icon.heart {
            font-size: 1.12rem;
            filter: drop-shadow(0 0 6px #ff1744);
            animation: gentleHeart 2s infinite ease-in-out;

        @keyframes gentleHeart {

            50% { transform: scale(1.14); filter: drop-shadow(0 0 9px #ff2d55); }

            opacity: 0.55;

            font-size: 0.82rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);

        .tap-pulse {
            animation: tapPulseAnim 0.35s ease-out;

        @keyframes tapPulseAnim {
            0% { transform: scale(1); }
            50% { transform: scale(1.18); color: #fff; filter: drop-shadow(0 0 10px #ffd700); }
            100% { transform: scale(1); }
        }

        .new-mvp-crown {
            animation: newMvpFlash 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes newMvpFlash {
            0% { transform: scale(0.92); filter: brightness(2) drop-shadow(0 0 35px #ffd700); }
            50% { transform: scale(1.05); filter: brightness(1.4) drop-shadow(0 0 45px #c1121f); }
            100% { transform: scale(1); filter: brightness(1); }

        <svg class="snow-cap-left" viewBox="0 0 110 30" preserveAspectRatio="none">
            <path d="M2,26 C2,10 18,4 38,5 C58,6 75,2 95,6 C103,8 108,14 104,20 C98,25 78,18 60,21 C40,24 22,19 12,26 C6,29 2,28 2,26 Z" fill="#f1f5f9"/>
            <path d="M5,23 C8,11 22,6 40,7 C58,8 75,5 92,8 C99,10 102,14 98,17 C90,21 75,15 58,18 C38,21 20,17 10,24 Z" fill="#ffffff"/>
        </svg>

        <svg class="snow-cap-right" viewBox="0 0 110 30" preserveAspectRatio="none">

            <path d="M105,23 C102,11 88,6 70,7 C52,8 35,5 18,8 C11,10 8,14 12,17 C20,21 35,15 52,18 C72,21 90,17 100,24 Z" fill="#ffffff"/>
        </svg>

        <div class="top-badge-anchor">
            <svg class="santa-hat-roof" viewBox="0 0 120 75">
                <path d="M25,52 C12,42 5,45 3,36 C10,36 16,32 20,38 C18,30 24,25 30,27 C28,36 28,44 25,52 Z" fill="#1b7a3d" stroke="#082e13" stroke-width="1.2"/>
                <circle cx="24" cy="48" r="4.5" fill="#d62828"/>
                <circle cx="19" cy="52" r="4" fill="#e63946"/>
                <path d="M24,52 C28,22 52,6 78,10 C98,13 108,30 110,48 C96,38 82,36 68,46 Z" fill="url(#hatRed)"/>
                <circle cx="107" cy="49" r="11" fill="url(#furWhite)"/>
                <path d="M18,52 C18,43 34,40 58,41 C80,42 94,46 95,55 C95,63 78,65 56,64 C32,63 18,60 18,52 Z" fill="url(#furWhite)"/>
            </svg>

            <div class="top-pill-wrapper">
                <svg class="pill-snow-left" viewBox="0 0 60 22" preserveAspectRatio="none">
                    <path d="M2,18 C4,6 18,2 38,4 C50,5 58,9 54,14 C48,18 32,12 18,16 C10,19 4,21 2,18 Z" fill="#ffffff"/>
                </svg>
                <svg class="pill-snow-right" viewBox="0 0 60 22" preserveAspectRatio="none">
                    <path d="M2,18 C4,6 18,2 38,4 C50,5 58,9 54,14 C48,18 32,12 18,16 C10,19 4,21 2,18 Z" fill="#ffffff"/>
                </svg>

                <div class="top-pill">
                    <span class="pill-title">TOP 3</span>
                    <span class="pill-highlight">TAP TAP</span>
                </div>

                <svg class="pill-holly-left" viewBox="0 0 24 24"><use href="#holly-cluster"/></svg>
                <svg class="pill-holly-right" viewBox="0 0 24 24"><use href="#holly-cluster"/></svg>
            </div>
        </div>

        <div class="christmas-card">
            
            <!-- Capa de nieve cayendo dentro del overlay -->
            <div class="snowfall-layer" id="snowfallLayer"></div>

            <svg class="lights-garland-svg" viewBox="0 0 280 22" preserveAspectRatio="none">
                <path d="M0,4 Q35,16 70,6 Q105,14 140,6 Q175,14 210,6 Q245,16 280,4" fill="none" stroke="#051c0e" stroke-width="1.5"/>
                <circle class="bulb-glow" cx="20" cy="9" r="3.2" fill="#ff2a2a" style="color:#ff2a2a"/>
                <circle class="bulb-glow d2" cx="50" cy="10" r="3.2" fill="#00f5d4" style="color:#00f5d4"/>
                <circle class="bulb-glow d3" cx="76" cy="7" r="3" fill="#fee440" style="color:#fee440"/>
                <circle class="bulb-glow" cx="204" cy="7" r="3" fill="#fee440" style="color:#fee440"/>
                <circle class="bulb-glow d2" cx="230" cy="10" r="3.2" fill="#ff2a2a" style="color:#ff2a2a"/>
                <circle class="bulb-glow d3" cx="260" cy="9" r="3.2" fill="#00e676" style="color:#00e676"/>
            </svg>

            <div class="tappers-list" id="tappersList">
            </div>

            <svg class="bottom-festive-trim" viewBox="0 0 300 34" preserveAspectRatio="none">
                <path d="M0,10 Q28,32 76,32 L28,32 Q6,32 0,18 Z" fill="#9e0b16"/>
                <path d="M0,5 Q22,24 66,29 Q34,17 2,2 Z" fill="#f8fafc"/>
                <path d="M0,8 Q26,29 72,31" fill="none" stroke="#e5b842" stroke-width="2.2"/>
                <path d="M300,10 Q272,32 224,32 L272,32 Q294,32 300,18 Z" fill="#9e0b16"/>
                <path d="M300,5 Q278,24 234,29 Q266,17 298,2 Z" fill="#f8fafc"/>
                <path d="M300,8 Q274,29 228,31" fill="none" stroke="#e5b842" stroke-width="2.2"/>
            </svg>

        </div>

    </div>

    <!-- PUENTE IFRAME Y SOCKET.IO DE TIKDANCE -->
    <script src="/js/iframe-bridge.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        function formatLikes(num) {
            if (!num || isNaN(num)) return '0';
            if (num >= 1000000) return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
            return num.toString();
        }

        const urlParams = new URLSearchParams(window.location.search);
        const userParam = urlParams.get('user') || '';
        const isTestMode = urlParams.get('test') === 'true';

        let isUsingDemoData = !isTestMode;
        let tappersData = [];
        let lastLeaderId = null;

        const demoData = [
            { uniqueId: 'eclonyx', nickname: 'ECLONYX', profilePictureUrl: '', likes: 14500, streak: 7, coins: 3 },
            { uniqueId: 'queendancer', nickname: 'Sofia Queen 👑', profilePictureUrl: '', likes: 9800, streak: 5, coins: 2 },
            { uniqueId: 'alex_tapper', nickname: 'Alex VIP ✨', profilePictureUrl: '', likes: 6200, streak: 3, coins: 1 }
        ];

        if (isUsingDemoData) {
            tappersData = JSON.parse(JSON.stringify(demoData));
        }

        const tappersListEl = document.getElementById('tappersList');
        const snowfallLayerEl = document.getElementById('snowfallLayer');

        function initSnowfall() {
            if (!snowfallLayerEl) return;
            snowfallLayerEl.innerHTML = '';
            const totalFlakes = 26;
            const symbols = ['❄', '❅', '❆'];

            for (let i = 0; i < totalFlakes; i++) {
                const flake = document.createElement('div');
                const isStar = i % 3 === 0;
                flake.className = `snowflake-drop ${isStar ? 'flake-star' : 'flake-dot'}`;

                const left = Math.random() * 96 + 2;
                const duration = (Math.random() * 4.5 + 4.2).toFixed(2);
                const delay = (Math.random() * -9).toFixed(2);
                const sway = (Math.random() * 28 - 14).toFixed(1) + 'px';
                const opacity = (Math.random() * 0.45 + 0.4).toFixed(2);

                flake.style.left = `${left}%`;
                flake.style.animationDuration = `${duration}s`;
                flake.style.animationDelay = `${delay}s`;
                flake.style.setProperty('--flake-sway', sway);
                flake.style.setProperty('--flake-opacity', opacity);

                if (isStar) {
                    flake.textContent = symbols[i % symbols.length];
                    flake.style.fontSize = `${Math.floor(Math.random() * 6 + 8)}px`;
                } else {
                    const size = (Math.random() * 3.5 + 2.5).toFixed(1);
                    flake.style.width = `${size}px`;
                    flake.style.height = `${size}px`;
                }

                snowfallLayerEl.appendChild(flake);
            }
        }
        initSnowfall();

        const snowmanSVG = `
            <svg class="snowman-buddy" viewBox="0 0 40 50">
                <rect x="11" y="10" width="18" height="3" rx="1.5" fill="#1e293b"/>
                <rect x="14" y="2" width="12" height="9" rx="1" fill="#0f172a"/>
                <rect x="14" y="8" width="12" height="2.2" fill="#d62828"/>
                <circle cx="20" cy="36" r="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
                <circle cx="20" cy="20" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
                <circle cx="17.5" cy="18.5" r="1.2" fill="#0f172a"/>
                <circle cx="22.5" cy="18.5" r="1.2" fill="#0f172a"/>
                <polygon points="20,19.5 26,21 20,22" fill="#fb8500"/>
                <path d="M13,25 Q20,28 27,25 L26,28 Q20,30 14,28 Z" fill="#d62828"/>
                <path d="M23,26 L26,34 L22,34 Z" fill="#e63946"/>
                <circle cx="20" cy="33" r="1.2" fill="#1e293b"/>
                <circle cx="20" cy="38" r="1.2" fill="#1e293b"/>
            </svg>
        `;

        const cardSnowflakesBg = `
            <svg class="card-snowflakes-bg" viewBox="0 0 270 80" preserveAspectRatio="xMidYMid slice">
                <g opacity="0.2" stroke="#2d8a4e" stroke-width="1.4" fill="none">
                    <path d="M0,0 L28,20 M8,0 L22,12"/>
                    <path d="M270,80 L240,55 M262,80 L246,64"/>
                </g>
                <use href="#gold-snowflake" x="232" y="5" width="24" height="24" opacity="0.55"/>
                <use href="#gold-snowflake" x="202" y="30" width="20" height="20" opacity="0.4"/>
                <use href="#gold-snowflake" x="178" y="54" width="18" height="18" opacity="0.45"/>
                <use href="#gold-snowflake" x="228" y="56" width="16" height="16" opacity="0.45"/>
                <circle cx="195" cy="16" r="1.5" fill="#fff3b0" opacity="0.75"/>
                <circle cx="220" cy="46" r="1.4" fill="#ffd700" opacity="0.65"/>
                <path d="M185,22 L186.5,26 L190.5,27.5 L186.5,29 L185,33 L183.5,29 L179.5,27.5 L183.5,26 Z" fill="#ffd700" opacity="0.55"/>
            </svg>
        `;

        const santaHatAvatarSVG = `
            <svg class="avatar-santa-hat" viewBox="0 0 100 68">
                <path d="M16,46 C22,18 46,6 70,12 C86,16 94,30 95,45 C82,36 68,34 54,42 Z" fill="url(#hatRed)"/>
                <circle cx="93" cy="46" r="9.5" fill="url(#furWhite)"/>
                <path d="M10,46 C10,38 26,35 48,36 C68,37 82,41 82,49 C82,56 66,58 46,57 C24,56 10,53 10,46 Z" fill="url(#furWhite)"/>
            </svg>
        `;

        function renderTop3() {
            tappersData.sort((a, b) => b.likes - a.likes);
            tappersListEl.innerHTML = '';

            let leaderChanged = false;
            if (tappersData.length > 0) {
                const mvp = tappersData[0];
                if (lastLeaderId !== mvp.uniqueId) {
                    if (lastLeaderId !== null) leaderChanged = true;
                    lastLeaderId = mvp.uniqueId;
                }
            }

            for (let i = 0; i < 3; i++) {
                const rank = i + 1;
                const user = tappersData[i];

                const card = document.createElement('div');
                card.className = `hero-tapper-card rank-${rank}`;
                if (rank === 1 && leaderChanged) {
                    card.classList.add('new-mvp-crown');
                }

                const cornersHTML = `
                    <svg class="corner-holly tl" viewBox="0 0 24 24"><use href="#holly-cluster"/></svg>
                    <svg class="corner-holly tr" viewBox="0 0 24 24"><use href="#holly-cluster"/></svg>
                    <svg class="corner-holly bl" viewBox="0 0 24 24"><use href="#holly-cluster"/></svg>
                    <svg class="corner-holly br" viewBox="0 0 24 24"><use href="#holly-cluster"/></svg>
                    ${rank === 3 ? snowmanSVG : ''}
                    ${cardSnowflakesBg}
                `;

                if (user) {
                    card.id = `row-${user.uniqueId}`;
                    const initial = (user.nickname || user.uniqueId || '?').trim().charAt(0).toUpperCase();
                    const streakVal = user.streak || Math.max(1, Math.min(99, Math.floor(user.likes / 500) || 1));
                    const medalText = rank === 1 ? '1' : `#${rank}`;

                    const avatarHTML = user.profilePictureUrl && user.profilePictureUrl.trim().length > 0 ?
                        `<img src="${user.profilePictureUrl}" class="avatar-img" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'avatar-fallback\\'>${initial}</div>';" />` :
                        `<div class="avatar-fallback">${initial}</div>`;

                    card.innerHTML = `
                        ${cornersHTML}
                        <div class="avatar-section">
                            ${rank === 1 ? santaHatAvatarSVG : ''}
                            <div class="avatar-circle-ring">
                                ${avatarHTML}
                            </div>
                            <div class="rank-medal-badge medal-${rank}">${medalText}</div>
                        </div>

                        <div class="hero-tapper-info">
                            <div class="tapper-header-row">
                                ${rank === 1 ? '<span class="mvp-tag-ribbon">👑 MVP</span>' : ''}
                                <span class="tapper-name">${user.nickname || user.uniqueId}</span>
                            </div>

                            <div class="metrics-row">
                                <div class="metric-group">
                                    <span class="streak-num">${streakVal}</span>
                                    <svg class="candy-cane-icon" viewBox="0 0 28 36"><use href="#candy-cane-svg"/></svg>
                                </div>
                                <div class="metric-group" id="pts-${user.uniqueId}">
                                    <span class="stat-icon heart">❤️</span>
                                    <span class="stat-val-likes">${formatLikes(user.likes)}</span>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    card.classList.add('empty-slot');
                    const medalText = rank === 1 ? '1' : `#${rank}`;
                    card.innerHTML = `
                        ${cornersHTML}
                        <div class="avatar-section">
                            ${rank === 1 ? santaHatAvatarSVG : ''}
                            <div class="avatar-circle-ring">
                                <div class="avatar-fallback">🎅</div>
                            </div>
                            <div class="rank-medal-badge medal-${rank}">${medalText}</div>
                        </div>
                        <div class="hero-tapper-info">
                            <div class="tapper-header-row">
                                <span class="empty-slot-text">👆 Tap tap para #${rank}</span>
                            </div>
                            <div class="metrics-row">
                                <div class="metric-group">
                                    <span style="opacity:0.4;">--</span>
                                </div>
                            </div>
                        </div>
                    `;
                }

                tappersListEl.appendChild(card);
            }
        }

        function triggerPulse(uniqueId) {
            const rowPts = document.getElementById(`pts-${uniqueId}`);
            if (rowPts) {
                rowPts.classList.remove('tap-pulse');
                void rowPts.offsetWidth;
                rowPts.classList.add('tap-pulse');
            }
        }

        function processLiveLike(uniqueId, nickname, profilePictureUrl, totalLikesSent, increment = 1) {
            if (!uniqueId) return;

            if (isUsingDemoData) {
                isUsingDemoData = false;
                tappersData = [];
            }

            let user = tappersData.find(u => u.uniqueId === uniqueId);
            const likesAmount = typeof increment === 'number' && increment > 0 ? increment : 1;

            if (user) {
                if (totalLikesSent && totalLikesSent > user.likes) {
                    user.likes = totalLikesSent;
                } else {
                    user.likes += likesAmount;
                }
                user.streak = (user.streak || 1) + 1;
                if (nickname) user.nickname = nickname;
                if (profilePictureUrl) user.profilePictureUrl = profilePictureUrl;
            } else {
                user = {
                    uniqueId: uniqueId,
                    nickname: nickname || uniqueId,
                    profilePictureUrl: profilePictureUrl || '',
                    likes: totalLikesSent || likesAmount,
                    streak: 1,
                    coins: 1
                };
                tappersData.push(user);
            }

            renderTop3();
            triggerPulse(uniqueId);
        }

        renderTop3();

        const socket = window.__iframeBridgeSocket || (typeof io !== 'undefined' ? io({ query: userParam ? { user: userParam } : {} }) : null);

        if (socket) {
            socket.on('tiktokLiveEvent', (event) => {
                if (!event) return;
                if (event.tipo === 'like') {
                    processLiveLike(
                        event.usuario || event.uniqueId,
                        event.nickname || event.name,
                        event.avatar || event.profilePictureUrl,
                        event.totalLikeCount || event.totalLikes,
                        event.cantidad || event.likeCount || 1
                    );
                }
            });

            socket.on('like', (data) => {
                if (!data) return;
                processLiveLike(
                    data.uniqueId || data.usuario,
                    data.nickname || data.name,
                    data.profilePictureUrl || data.avatar,
                    data.totalLikeCount,
                    data.likeCount || data.cantidad || 1
                );
            });
        }

        window.addEventListener('message', (event) => {
            if (!event.data) return;
            const d = event.data;
            if (d.event === 'tiktokLiveEvent' || d.type === 'tiktokLiveEvent') {
                const payload = d.data || d;
                if (payload.tipo === 'like') {
                    processLiveLike(
                        payload.usuario || payload.uniqueId,
                        payload.nickname || payload.name,
                        payload.avatar || payload.profilePictureUrl,
                        payload.totalLikeCount,
                        payload.cantidad || payload.likeCount || 1
                    );
                }
            }
        });

        if (isTestMode) {
            isUsingDemoData = false;
            tappersData = JSON.parse(JSON.stringify(demoData));
            renderTop3();
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 't' || e.key === 'T') {
                isUsingDemoData = false;
                const testUsers = [
                    { id: 'eclonyx', name: 'ECLONYX' },
                    { id: 'queendancer', name: 'Sofia Queen 👑' },
                    { id: 'alex_tapper', name: 'Alex VIP ✨' },
                    { id: 'new_challenger', name: 'Nuevo Fan 🎄' }
                ];
                const selected = testUsers[Math.floor(Math.random() * testUsers.length)];
                processLiveLike(selected.id, selected.name, '', 0, Math.floor(Math.random() * 85) + 15);
            }
        });
    </script>
</body>
