    <!-- Inyección de multi-cuenta -->
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const user = urlParams.get('user');
            if (user) {
                const originalFetch = window.fetch;
                window.fetch = function(url, options) {
                    if (typeof url === 'string' && !url.includes('user=')) {
                        const sep = url.includes('?') ? '&' : '?';
                        url = url + sep + 'user=' + encodeURIComponent(user);
                    }
                    return originalFetch(url, options);
                };
                const originalIo = window.io;
                if (originalIo) {
                    window.io = function(opts) {
                        opts = opts || {};
                        opts.query = opts.query || {};
                        opts.query.user = user;
                        return originalIo(opts);
                    };
                } else {
                    let _io = undefined;
                    Object.defineProperty(window, 'io', {
                        get: function() { return _io; },
                        set: function(val) {
                            _io = function(opts) {
                                opts = opts || {};
                                opts.query = opts.query || {};
                                opts.query.user = user;
                                return val(opts);
                            };
                        },
                        configurable: true
                    });
                }
            }
        })();
    </script>

        /* Configuración de brillo neón global */
        body.neon-none * {
            text-shadow: none !important;

            border-color: rgba(255,255,255,0.2) !important;

        .timer-container { 
            display: none; 
            justify-content: center; 
            align-items: flex-start; 
            width: 100%;
            height: 100vh;
            padding-top: 15px;
            box-sizing: border-box;
        }
        .timer-activo { display: flex; }

        /* Contenedor principal — fondo oscuro con sparkles */
        .caja-central { 
            position: relative;
            background:
                radial-gradient(ellipse 70% 70% at 50% 50%, rgba(30,0,50,0.6) 0%, transparent 100%),
                #0a0a12;
            border: 2.5px solid rgba(200,0,255,0.6); 
            border-radius: 28px; 
            padding: 16px 25px 16px 18px; 
            display: flex;
            align-items: center;

                0 0 22px rgba(180,0,255,0.25),
                inset 0 0 20px rgba(0,0,0,0.5); 
            box-sizing: border-box;
            width: fit-content;
            max-width: 95vw;
            transition: all 0.4s ease;
            margin: 0 auto;
            overflow: visible;
        }
        /* Dot grid texture */
        .caja-central::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 28px;
            background: radial-gradient(rgba(255,255,255,0.055) 1px, transparent 1px) 0 0 / 18px 18px;
            pointer-events: none;
            z-index: 0;
        }

        /* Sparkles distribuidas por todo el interior del card */
        .sparkles-bg {
            position: absolute;
            inset: 0;
            border-radius: 28px;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }
        .sparkles-bg .sparkle-star { position: absolute; opacity: 0; }
        .sb1  { top:  8%; left:  12%; animation: sparkFade 2.2s 0.0s infinite; }
        .sb2  { top: 15%; left:  38%; animation: sparkFade 1.7s 0.5s infinite; }
        .sb3  { top: 10%; left:  62%; animation: sparkFade 2.5s 1.1s infinite; }
        .sb4  { top: 12%; left:  82%; animation: sparkFade 1.9s 1.8s infinite; }
        .sb5  { top: 45%; left:   5%; animation: sparkFade 2.0s 0.7s infinite; }
        .sb6  { top: 50%; left:  28%; animation: sparkFade 1.6s 1.4s infinite; }
        .sb7  { top: 48%; left:  55%; animation: sparkFade 2.3s 0.2s infinite; }
        .sb8  { top: 52%; left:  78%; animation: sparkFade 1.8s 2.0s infinite; }
        .sb9  { top: 80%; left:  15%; animation: sparkFade 2.1s 0.9s infinite; }
        .sb10 { top: 78%; left:  45%; animation: sparkFade 1.5s 1.6s infinite; }
        .sb11 { top: 82%; left:  70%; animation: sparkFade 2.4s 0.4s infinite; }

        /* Wrapper del Marco Halloween + Foto Avatar */
        .avatar-frame-wrapper {
            position: relative;
            width: 145px;
            height: 145px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        /* Foto recortada redonda — borde neón morado como el timer */
        .avatar-foto-crop {
            position: absolute;
            width: 142px;
            height: 142px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            overflow: hidden;
            background: #1a0030;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            border: 3px solid #c800ff;
            box-shadow:

                0 0 55px rgba(144,0,255,0.5),
                inset 0 0 12px rgba(180,0,255,0.3);

        .avatar-foto-crop img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .avatar-fallback-initial {
            font-size: 58px;
            font-weight: bold;

            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;

        /* Contenido derecho */
        .contenido-derecho {
            display: flex;

            flex-grow: 1;

            min-width: 320px;
            gap: 10px;
            z-index: 2;
            margin-left: 18px;
        }

        /* ═══ SPARKLES LATERALES ═══ */
        .sparkles-left, .sparkles-right {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 130px;
            pointer-events: none;
            z-index: 5;

        .sparkles-left  { left:  -8px; }
        .sparkles-right { right: -8px; transform: translateY(-50%) scaleX(-1); }
        .sparkle-star { position: absolute; opacity: 0; }
        .sparkle-star svg { display: block; }
        @keyframes sparkFade {
            0%   { opacity: 0;   transform: scale(0.4) rotate(0deg); }
            30%  { opacity: 1;   transform: scale(1)   rotate(15deg); }
            70%  { opacity: 0.8; transform: scale(0.9) rotate(30deg); }
            100% { opacity: 0;   transform: scale(0.3) rotate(45deg); }

            display: flex; 
            align-items: center;

            gap: 15px;

            font-family: 'Nosifer', 'Bangers', cursive;

            z-index: 1;
            min-width: 0;
            flex: 1 1 auto;

        .reloj { 
            font-family: 'Nosifer', 'Bangers', cursive;
            font-size: clamp(30px, 3.6vw, 56px); 
            letter-spacing: 3px;
            background: linear-gradient(180deg, #FFFFFF 20%, #FFB6EE 60%, #E600BD 100%);

            margin: 0;
            white-space: nowrap;
            z-index: 1;
            flex-shrink: 0;

        /* Barra de Progreso de la Meta */
        .bar-container { 
            width: 100%; 
            height: 34px; 
            border-radius: 17px; 
            border: 2px solid rgba(200,100,255,0.7); 
            position: relative; 
            overflow: hidden; 
            background: rgba(8,2,18,0.75);
            box-shadow: 0 0 10px rgba(180,0,255,0.4), inset 0 0 8px rgba(0,0,0,0.6);
            z-index: 1;
            box-sizing: border-box;
        }

        .bar-fill { 
            height: 100%; 
            width: 0%; 
            transition: width 0.5s ease; 
            background: linear-gradient(90deg, #c800ff, #ff40f0, #ff00aa); 
        }

        .bar-text { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 22px; 
            font-weight: bold; 
            text-shadow: 2px 2px 4px #000; 
            z-index: 10; 
            color: #FFF;
        }

        .badge-logrado {
            display: none;
            color: #00FF88;
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 2px;
            margin-left: 12px;
            text-shadow: 0 0 8px #00FF88, 0 0 16px #00FF88, 2px 2px 4px #000;
            animation: pulseLogrado 1.5s infinite alternate;
        }
        @keyframes pulseLogrado {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px #00FF88); }
            100% { transform: scale(1.08); filter: drop-shadow(0 0 15px #00FF88); }
        }

        @media (max-width: 750px) {
            body { padding: 5px; }
            .timer-container { padding-top: 45px; }
            .caja-central {
                flex-direction: column;
                padding: 45px 15px 15px 15px;
                align-items: center;
                gap: 12px;
                width: 98%;

            .avatar-frame-wrapper {
                width: 130px;
                height: 130px;

            .avatar-foto-crop {

                height: 108px;

            .avatar-fallback-initial {

            .contenido-derecho {
                margin-left: 0;

                align-items: center;
                gap: 10px;

            .fila-principal {

                align-items: center;
                gap: 6px;

            .titulo-bailando {
                font-size: 40px;
                text-align: center;
                white-space: normal;

            }
            .reloj {
                font-size: 44px;
                text-align: center;
            }
            .bar-container {
                height: 32px;
            }
            .bar-text {
                font-size: 18px;

            }
        }    }

        .parpadeo { animation: parpadeoAnim 0.8s infinite alternate; }
        @keyframes parpadeoAnim { from { opacity: 1; } to { opacity: 0.3; } }
        </style>

                    <div class="sparkle-star sb5"><svg width="13" height="13" viewBox="0 0 24 24"><path fill="#c084fc" d="M12 2l1.8 5.5H20l-4.9 3.6 1.9 5.6L12 13l-4.9 3.6 1.9-5.6L4 7.5h6.2z"/></svg></div>
                    <div class="sparkle-star sb6"><svg width="7" height="7" viewBox="0 0 24 24"><path fill="#ffffff" d="M12 2l1.8 5.5H20l-4.9 3.6 1.9 5.6L12 13l-4.9 3.6 1.9-5.6L4 7.5h6.2z"/></svg></div>
                    <div class="sparkle-star sb7"><svg width="10" height="10" viewBox="0 0 24 24"><path fill="#f0c0ff" d="M12 2l1.8 5.5H20l-4.9 3.6 1.9 5.6L12 13l-4.9 3.6 1.9-5.6L4 7.5h6.2z"/></svg></div>
                    <div class="sparkle-star sb8"><svg width="12" height="12" viewBox="0 0 24 24"><path fill="#e0aaff" d="M12 2l1.8 5.5H20l-4.9 3.6 1.9 5.6L12 13l-4.9 3.6 1.9-5.6L4 7.5h6.2z"/></svg></div>
                    <div class="sparkle-star sb9"><svg width="9" height="9" viewBox="0 0 24 24"><path fill="#ffffff" d="M12 2l1.8 5.5H20l-4.9 3.6 1.9 5.6L12 13l-4.9 3.6 1.9-5.6L4 7.5h6.2z"/></svg></div>
                    <div class="sparkle-star sb10"><svg width="14" height="14" viewBox="0 0 24 24"><path fill="#d8b4fe" d="M12 2l1.8 5.5H20l-4.9 3.6 1.9 5.6L12 13l-4.9 3.6 1.9-5.6L4 7.5h6.2z"/></svg></div>
                    <div class="sparkle-star sb11"><svg width="8" height="8" viewBox="0 0 24 24"><path fill="#ff80ff" d="M12 2l1.8 5.5H20l-4.9 3.6 1.9 5.6L12 13l-4.9 3.6 1.9-5.6L4 7.5h6.2z"/></svg></div>
                    <div class="sparkle-star sb12"><svg width="11" height="11" viewBox="0 0 24 24"><path fill="#c084fc" d="M12 2l1.8 5.5H20l-4.9 3.6 1.9 5.6L12 13l-4.9 3.6 1.9-5.6L4 7.5h6.2z"/></svg></div>
                </div>
                <div class="avatar-frame-wrapper">
                    <div class="avatar-foto-crop">
                        <img id="avatar-img-transicion" src="" alt="Avatar" onload="this.style.display='block'; this.nextElementSibling.style.display='none';" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="avatar-fallback-initial" id="avatar-fallback-transicion">Q</div>
                    </div>
                    <img src="/fondo/marco_halloween_queen.png" class="marco-purple-img" id="marco-transicion" alt="Marco Halloween">
                </div>
                <div class="contenido-derecho">
                    <div class="fila-principal">
                        <div class="titulo-bailando" id="texto-transicion">
                            ¡SIGUIENTE: <span class="t-Amy">AMY</span>!
                        </div>
                        <div class="reloj parpadeo" id="countdown-transicion">5</div>
                    </div>
                    <div class="bar-container" style="border-color: #555;">
                        <div class="bar-text" style="color: #FFD700; text-shadow: 1px 1px 2px #000">¡NO LLEGARON A LA META!</div>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
        <script src="/js/iframe-bridge.js"></script>
        <script src="/socket.io/socket.io.js"></script>
        <script>
        const socket = window.__iframeBridgeSocket || io();
        let QUEEN_COLORS = {};
        let APODOS = {};
        let QUEEN_AVATARS = {};
        const contenedor = document.getElementById('contenedor-principal');
        const cajaReloj = document.getElementById('caja-reloj');
        const displayReloj = document.getElementById('timer-display');
        const nombreBailando = document.getElementById('nombre-bailando');
        const barraMeta = document.getElementById('barra-meta');
        const txtPuntos = document.getElementById('puntos-actuales');
        const txtMeta = document.getElementById('meta-total');
        const cajaTransicion = document.getElementById('caja-transicion');
        const textoTransicion = document.getElementById('texto-transicion');
        const countdownTransicion = document.getElementById('countdown-transicion');

        function resolverRutaAvatar(src) {
            if (!src) return '';
            if (src.startsWith('/') || src.startsWith('http') || src.startsWith('data:')) return src;
            return '/regalos/' + src;
        }

        fetch('/api/queens/all').then(r => r.json()).then(all => {
            all.forEach(q => {
                QUEEN_COLORS[q.name] = q.color;
                QUEEN_AVATARS[q.name] = q.avatar_img || q.regalo_img || '';
            });
        });
        fetch('/api/apodos').then(r => r.json()).then(map => { APODOS = map; });

        socket.on('queensActualizadas', (data) => {
            if (data.equipos) {
                Object.keys(data.equipos).forEach(n => {
                    QUEEN_COLORS[n] = data.equipos[n].color;
                    QUEEN_AVATARS[n] = data.equipos[n].avatar_img || data.equipos[n].regalo_img || '';
                });
            }
            if (data.apodos) APODOS = data.apodos;
        });

        function lighten(hex) {
            try {
                let r = Math.min(255, parseInt(hex.slice(1,3),16)+60);
                let g = Math.min(255, parseInt(hex.slice(3,5),16)+60);
                let b = Math.min(255, parseInt(hex.slice(5,7),16)+60);
                return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
            } catch(e) { return hex; }
        }

        function formatearTiempo(segundos) {
            let m = Math.floor(segundos / 60).toString().padStart(2, '0');
            let s = (segundos % 60).toString().padStart(2, '0');
            return m + ':' + s;
        }

        function aplicarColoresChica(chica) {
            const color = QUEEN_COLORS[chica] || '#00ffff';
            const light = lighten(color);
            const apodo = APODOS[chica] || chica;
            nombreBailando.innerText = apodo;
            nombreBailando.style.color = color;
            cajaReloj.style.borderColor = color;
            cajaReloj.style.boxShadow = `0 0 35px ${color}`;
            cajaTransicion.style.borderColor = color;
            cajaTransicion.style.boxShadow = `0 0 35px ${color}`;
            barraMeta.style.background = `linear-gradient(90deg, ${color}, ${light})`;
            const brilloReloj = `drop-shadow(0 0 8px ${color}) drop-shadow(0 0 18px ${color}) drop-shadow(0 0 32px ${color}) drop-shadow(3px 4px 0px #2A003E)`;
            displayReloj.style.filter = brilloReloj;
            countdownTransicion.style.filter = brilloReloj;

            // Actualizar Avatar y Marco
            const avatarRaw = QUEEN_AVATARS[chica] || '';
            const avatarUrl = resolverRutaAvatar(avatarRaw);
            const initial = (apodo || chica || 'Q').charAt(0).toUpperCase();

            ['reloj', 'transicion'].forEach(key => {
                const imgEl = document.getElementById(`avatar-img-${key}`);
                const fallbackEl = document.getElementById(`avatar-fallback-${key}`);
                const marcoEl = document.getElementById(`marco-${key}`);

                if (fallbackEl) fallbackEl.innerText = initial;

                if (marcoEl) {
                    marcoEl.style.filter = `drop-shadow(0 0 12px ${color})`;
                }

                if (imgEl) {
                    if (avatarUrl) {
                        imgEl.src = avatarUrl;
                    } else {
                        imgEl.style.display = 'none';
                        if (fallbackEl) fallbackEl.style.display = 'flex';
                    }
                }
            });
        }

        let currentChica = '';
        let currentMeta = 2000;
        let currentPuntos = 0;
        let currentTiempo = 300;
        let currentTituloPrefix = 'CONOCIENDO A:';
        let confetiDisparado = false;

        function lanzarConfetiLogrado() {
            if (typeof confetti === 'function') {
                const colorChica = QUEEN_COLORS[currentChica] || '#00ffff';
                const caja = document.getElementById('caja-reloj');
                
                let originX = 0.5;
                let originY = 0.22;
                let leftX = 0.38;
                let rightX = 0.62;

                if (caja) {
                    const rect = caja.getBoundingClientRect();
                    originX = (rect.left + rect.width / 2) / window.innerWidth;
                    originY = (rect.top + rect.height / 2) / window.innerHeight;
                    leftX = rect.left / window.innerWidth;
                    rightX = rect.right / window.innerWidth;
                }

                const colors = [colorChica, '#00FF88', '#FF00D4', '#9000FF', '#FFD700', '#FFFFFF'];

                // 1. Explosión central sobre la caja principal
                confetti({
                    particleCount: 120,
                    spread: 110,
                    startVelocity: 45,
                    origin: { x: originX, y: originY },
                    colors: colors,
                    zIndex: 99999
                });

                // 2. Cañones desde las dos esquinas superiores de la caja principal
                confetti({
                    particleCount: 80,
                    angle: 60,
                    spread: 75,
                    startVelocity: 42,
                    origin: { x: Math.max(0.02, leftX), y: originY },
                    colors: colors,
                    zIndex: 99999
                });

                confetti({
                    particleCount: 80,
                    angle: 120,
                    spread: 75,
                    startVelocity: 42,
                    origin: { x: Math.min(0.98, rightX), y: originY },
                    colors: colors,
                    zIndex: 99999
                });

                // 3. Ráfaga secundaria de destellos en la caja (180ms después)
                setTimeout(() => {
                    confetti({
                        particleCount: 75,
                        spread: 130,
                        startVelocity: 35,
                        decay: 0.92,
                        scalar: 1.2,
                        origin: { x: originX, y: originY },
                        colors: [colorChica, '#00FF88', '#FFD700', '#FFFFFF'],
                        shapes: ['star', 'circle'],
                        zIndex: 99999
                    });
                }, 180);
            }
        }

        function actualizarEstadoVisual() {
            const txtTitulo = document.getElementById('texto-titulo-dinamica');
            const txtNombre = document.getElementById('nombre-bailando');
            const colorChica = QUEEN_COLORS[currentChica] || '#00ffff';
            const apodo = (APODOS[currentChica] || currentChica).toUpperCase();

            // La verificación y cambio de texto ocurren ÚNICAMENTE cuando el temporizador llega a 00:00 (currentTiempo <= 0)
            if (currentTiempo <= 0) {
                if (txtTitulo) txtTitulo.style.display = 'none';
                if (txtNombre) {
                    if (currentMeta > 0 && currentPuntos >= currentMeta) {
                        // Estado: META CUMPLIDA (Logrado al llegar a 00:00)
                        txtNombre.innerText = '¡LOGRADO!';
                        txtNombre.style.setProperty('--color-logrado', colorChica);
                        txtNombre.classList.add('animacion-logrado-activa');
                        
                        // Disparar confeti en la caja principal en sincronía exacta
                        if (!confetiDisparado) {
                            lanzarConfetiLogrado();
                            confetiDisparado = true;
                        }
                    } else {
                        // Estado: TIEMPO AGOTADO SIN META (No logrado al llegar a 00:00)
                        txtNombre.classList.remove('animacion-logrado-activa');
                        txtNombre.style.webkitTextFillColor = '';
                        txtNombre.style.background = '';
                        txtNombre.innerText = 'GRACIAS';
                        txtNombre.style.color = colorChica;
                        txtNombre.style.textShadow = `0 0 10px ${colorChica}, 0 0 25px ${colorChica}, 3px 3px 6px #000`;
                    }
                }
            } else {
                // Estado: TIEMPO ACTIVO (> 0) -> Se mantiene "CONOCIENDO A: [NOMBRE]" sumando puntos normalmente
                confetiDisparado = false;
                if (txtNombre) {
                    txtNombre.classList.remove('animacion-logrado-activa');
                    txtNombre.style.webkitTextFillColor = '';
                    txtNombre.style.background = '';
                    txtNombre.innerText = apodo;
                    txtNombre.style.color = colorChica;
                    txtNombre.style.textShadow = '3px 3px 6px #000';
                }
                if (txtTitulo) {
                    txtTitulo.style.display = 'inline';
                    txtTitulo.innerText = currentTituloPrefix ? currentTituloPrefix + ' ' : '';
                }
            }
        }

        socket.on('conociendoInicio', (data) => {
            confetiDisparado = false;
            cajaTransicion.style.display = 'none';
            cajaReloj.style.display = 'flex';
            contenedor.classList.add('timer-activo');
            
            if (data.titulo !== undefined) {
                currentTituloPrefix = (data.titulo || '').trim();
            }
            if (data.chica) {
                currentChica = data.chica;
                if (data.avatar_img) QUEEN_AVATARS[data.chica] = data.avatar_img;
                aplicarColoresChica(data.chica);
            }
            currentTiempo = data.tiempo !== undefined ? data.tiempo : 300;
            currentMeta = data.meta !== undefined ? data.meta : 2000;
            currentPuntos = data.puntos !== undefined ? data.puntos : 0;

            displayReloj.innerText = formatearTiempo(currentTiempo);
            txtMeta.innerText = currentMeta;
            actualizarBarra(currentPuntos, currentMeta);
            actualizarEstadoVisual();
        });

        socket.on('conociendoTick', (tiempo) => { 
            currentTiempo = tiempo;
            displayReloj.innerText = formatearTiempo(tiempo);
            actualizarEstadoVisual();
        });

        socket.on('conociendoPuntos', (data) => { 
            currentPuntos = data.puntos;
            currentMeta = data.meta;
            actualizarBarra(data.puntos, data.meta);
            actualizarEstadoVisual();
        });

        socket.on('conociendoTransicion', (data) => {
            cajaReloj.style.display = 'none';
            cajaTransicion.style.display = 'flex';
            contenedor.classList.add('timer-activo');
            const col = QUEEN_COLORS[data.chica] || '#00ffff';
            textoTransicion.innerHTML = '¡SIGUIENTE: <span style="color:' + col + '">' + data.chica + '</span>!';
            countdownTransicion.innerText = data.tiempo;
            aplicarColoresChica(data.chica); 
        });

        socket.on('conociendoTransicionTick', (tiempo) => { countdownTransicion.innerText = tiempo; });
        
        socket.on('conociendoCancelado', () => { 
            contenedor.classList.remove('timer-activo'); 
            cajaReloj.style.display = 'none';
            cajaTransicion.style.display = 'none';
        });

        function actualizarBarra(puntos, meta) {
            txtPuntos.innerText = puntos;
            let porcentaje = meta === 0 ? 0 : (puntos / meta) * 100;
            if(porcentaje > 100) porcentaje = 100;
            barraMeta.style.width = porcentaje + '%';
        }

        // ── BRAND MANAGER LOGIC ──
        function loadGoogleFont(fontName) {
            if (!fontName) return;
            const fontId = 'custom-google-font';
            let link = document.getElementById(fontId);
            if (!link) {
                link = document.createElement('link');
                link.id = fontId;
                link.rel = 'stylesheet';
                document.head.appendChild(link);
            }
            link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(fontName)}:wght@400;700;800;900&display=swap`;
            document.body.style.fontFamily = `'${fontName}', sans-serif`;
        }

        function aplicarMarca(config) {
            if (!config) return;
            // Tipografía
            if (config.fontFamily) {
                loadGoogleFont(config.fontFamily);
            }
            // Logotipo
            const logoContainer = document.getElementById('agency-logo-container');
            const logoImg = document.getElementById('agency-logo');
            if (logoContainer && logoImg) {
                if (config.logoUrl) {
                    logoImg.src = config.logoUrl;
                    logoContainer.style.opacity = '1';
                    logoContainer.style.transform = 'scale(1)';
                } else {
                    logoContainer.style.opacity = '0';
                    logoContainer.style.transform = 'scale(0.8)';
                }
            }
            // Brillo neón
            document.body.classList.remove('neon-none', 'neon-low', 'neon-high');
            if (config.neonIntensity && config.neonIntensity !== 'normal') {
                document.body.classList.add('neon-' + config.neonIntensity);
            }
        }

        socket.on('marcaCambiado', aplicarMarca);
        </script>

    <!-- Logotipo de la Agencia Flotante -->
    <div id="agency-logo-container" style="position: absolute; top: 20px; right: 20px; z-index: 9999; pointer-events: none; transition: all 0.5s ease; opacity: 0; transform: scale(0.8);">
        <img id="agency-logo" src="" style="max-height: 80px; max-width: 150px; object-fit: contain; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));">
    </div>
</body>
</html>
