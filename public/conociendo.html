<!DOCTYPE html>
<html lang="es">
    <head>
    <!-- Inyección de multi-cuenta -->
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const user = urlParams.get('user');
            if (user) {
                const originalFetch = window.fetch;
                window.fetch = function(url, options) {
                    if (typeof url === 'string' && !url.includes('user=')) {
                        const sep = url.includes('?') ? '&' : '?';
                        url = url + sep + 'user=' + encodeURIComponent(user);
                    }
                    return originalFetch(url, options);
                };
                const originalIo = window.io;
                if (originalIo) {
                    window.io = function(opts) {
                        opts = opts || {};
                        opts.query = opts.query || {};
                        opts.query.user = user;
                        return originalIo(opts);
                    };
                } else {
                    let _io = undefined;
                    Object.defineProperty(window, 'io', {
                        get: function() { return _io; },
                        set: function(val) {
                            _io = function(opts) {
                                opts = opts || {};
                                opts.query = opts.query || {};
                                opts.query.user = user;
                                return val(opts);
                            };
                        },
                        configurable: true
                    });
                }
            }
        })();
    </script>

        <meta charset="UTF-8">
        <title>Conociendo a mi Queen</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nosifer&display=swap"
              rel="stylesheet">        <style>
        body { font-family: 'Bangers', cursive; text-align: center; overflow: hidden; background: transparent; color: white; margin: 0; padding: 10px; letter-spacing: 2px; box-sizing: border-box; width: 100vw; height: 100vh; }

        /* Configuración de brillo neón global */
        body.neon-none * {
            text-shadow: none !important;
            box-shadow: none !important;
            border-color: rgba(255,255,255,0.2) !important;
        }
        body.neon-low * {
            text-shadow: 0 0 3px currentColor !important;
            box-shadow: 0 0 5px currentColor !important;
        }
        
        .timer-container { 
            display: none; 
            justify-content: center; 
            align-items: flex-start; 
            width: 100%;
            height: 100vh;
            padding-top: 15px;
            box-sizing: border-box;
        }
        .timer-activo { display: flex; }

        /* Contenedor principal de la caja con fondo oscuro neón */
        .caja-central { 
            position: relative;
            background: rgba(0, 0, 0, 0.88); 
            border: 4px solid #00FFFF; 
            border-radius: 24px; 
            padding: 16px 25px 16px 145px; 
            display: flex;
            align-items: center;
            box-shadow: 0 0 35px #00FFFF, inset 0 0 15px rgba(0, 255, 255, 0.15); 
            box-sizing: border-box;
            width: 96%;
            max-width: 1250px;
            transition: all 0.3s ease;
            margin: 0 auto;
        }

        /* Wrapper del Marco Halloween + Foto Avatar */
        .avatar-frame-wrapper {
            position: relative;
            width: 170px;
            height: 170px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Foto recortada redonda grande detrás del orificio del marco */
        .avatar-foto-crop {
            position: absolute;
            width: 142px;
            height: 142px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            overflow: hidden;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 0;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
        }

        .avatar-foto-crop img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .avatar-fallback-initial {
            font-size: 58px;
            font-weight: bold;
            color: #FFF;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* Imagen del Marco de Halloween exacto suministrado por el usuario */
        .marco-purple-img {
            position: absolute;
            top: -46px;
            left: -154px;
            width: 485px;
            height: 272px;
            z-index: 1;
            filter: drop-shadow(0 0 12px currentColor);
            pointer-events: none;
        }

        /* Contenido derecho */
        .contenido-derecho {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            flex-shrink: 1;
            min-width: 0;
            gap: 10px;
            z-index: 2;
            margin-left: 90px;
        }

        .fila-principal { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 15px; 
            width: 100%;
            min-width: 0;
        }

        .titulo-bailando { 
            font-family: 'Nosifer', 'Bangers', cursive;
            font-size: clamp(30px, 3.6vw, 56px); 
            letter-spacing: 2px;
            color: #FFF; 
            text-shadow: 3px 3px 6px #000; 
            text-transform: uppercase; 
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 1;
            min-width: 0;
            flex: 1 1 auto;
            text-align: left;
        }

        .reloj { 
            font-family: 'Nosifer', 'Bangers', cursive;
            font-size: clamp(30px, 3.6vw, 56px); 
            letter-spacing: 3px;
            background: linear-gradient(180deg, #FFFFFF 20%, #FFB6EE 60%, #E600BD 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 2px #4B006E;
            filter: drop-shadow(0 0 8px #FF00D4) 
                    drop-shadow(0 0 18px #FF00D4) 
                    drop-shadow(0 0 32px #9000FF)
                    drop-shadow(3px 4px 0px #2A003E);
            line-height: 1; 
            margin: 0;
            white-space: nowrap;
            z-index: 1;
            flex-shrink: 0;
            transition: filter 0.3s ease;
        }
        
        /* Barra de Progreso de la Meta */
        .bar-container { 
            width: 100%; 
            height: 34px; 
            border-radius: 17px; 
            border: 2px solid #FFF; 
            position: relative; 
            overflow: hidden; 
            box-shadow: inset 0 0 10px #000;
            z-index: 1;
            box-sizing: border-box;
        }

        .bar-fill { 
            height: 100%; 
            width: 0%; 
            transition: width 0.5s ease; 
            background: #00FFFF; 
        }

        .bar-text { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 22px; 
            font-weight: bold; 
            text-shadow: 2px 2px 4px #000; 
            z-index: 10; 
            color: #FFF;
        }

        /* ── MODO ESTRECHO (TikTok LIVE Studio / Pantalla Vertical) ── */
        @media (max-width: 750px) {
            body { padding: 5px; }
            .timer-container { padding-top: 45px; }
            .caja-central {
                flex-direction: column;
                padding: 45px 15px 15px 15px;
                align-items: center;
                gap: 12px;
                width: 98%;
            }
            .avatar-frame-wrapper {
                width: 130px;
                height: 130px;
                margin: 0 auto;
            }
            .avatar-foto-crop {
                width: 108px;
                height: 108px;
            }
            .avatar-fallback-initial {
                font-size: 44px;
            }
            .marco-purple-img {
                top: -35px;
                left: -118px;
                width: 370px;
                height: 208px;
            }
            .contenido-derecho {
                margin-left: 0;
                width: 100%;
                align-items: center;
                gap: 10px;
            }
            .fila-principal {
                flex-direction: column;
                align-items: center;
                gap: 6px;
                width: 100%;
            }
            .titulo-bailando {
                font-size: 40px;
                text-align: center;
                white-space: normal;
                word-break: break-word;
            }
            .reloj {
                font-size: 44px;
                text-align: center;
            }
            .bar-container {
                height: 32px;
            }
            .bar-text {
                font-size: 18px;
            }
        }    }
        
        /* Colores aplicados dinámicamente via JS */

        .parpadeo { animation: parpadeoAnim 0.8s infinite alternate; }
        @keyframes parpadeoAnim { from { opacity: 1; } to { opacity: 0.3; } }
        </style>
    </head>
    <body>
        <div class="timer-container" id="contenedor-principal">
            <!-- CAJA PRINCIPAL CONOCIENDO -->
            <div class="caja-central" id="caja-reloj">
                <div class="avatar-frame-wrapper">
                    <div class="avatar-foto-crop">
                        <img id="avatar-img-reloj" src="" alt="Avatar" onload="this.style.display='block'; this.nextElementSibling.style.display='none';" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="avatar-fallback-initial" id="avatar-fallback-reloj">Q</div>
                    </div>
                    <img src="/fondo/marco_halloween_queen.png" class="marco-purple-img" id="marco-reloj" alt="Marco Halloween">
                </div>
                <div class="contenido-derecho">
                    <div class="fila-principal">
                        <div class="titulo-bailando">
                            <span id="texto-titulo-dinamica">CONOCIENDO A:</span> <span id="nombre-bailando">RAY</span>
                        </div>
                        <div class="reloj" id="timer-display">05:00</div>
                    </div>
                    <div class="bar-container">
                        <div class="bar-fill" id="barra-meta"></div>
                        <div class="bar-text">
                            <span id="puntos-actuales">0</span> / <span id="meta-total">2000</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CAJA TRANSICIÓN -->
            <div class="caja-central" id="caja-transicion" style="display: none;">
                <div class="avatar-frame-wrapper">
                    <div class="avatar-foto-crop">
                        <img id="avatar-img-transicion" src="" alt="Avatar" onload="this.style.display='block'; this.nextElementSibling.style.display='none';" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="avatar-fallback-initial" id="avatar-fallback-transicion">Q</div>
                    </div>
                    <img src="/fondo/marco_halloween_queen.png" class="marco-purple-img" id="marco-transicion" alt="Marco Halloween">
                </div>
                <div class="contenido-derecho">
                    <div class="fila-principal">
                        <div class="titulo-bailando" id="texto-transicion">
                            ¡SIGUIENTE: <span class="t-Amy">AMY</span>!
                        </div>
                        <div class="reloj parpadeo" id="countdown-transicion">5</div>
                    </div>
                    <div class="bar-container" style="border-color: #555;">
                        <div class="bar-text" style="color: #FFD700; text-shadow: 1px 1px 2px #000">¡NO LLEGARON A LA META!</div>
                    </div>
                </div>
            </div>
        </div>
        <script src="/js/iframe-bridge.js"></script>
        <script src="/socket.io/socket.io.js"></script>
        <script>
        const socket = window.__iframeBridgeSocket || io();
        let QUEEN_COLORS = {};
        let APODOS = {};
        let QUEEN_AVATARS = {};
        const contenedor = document.getElementById('contenedor-principal');
        const cajaReloj = document.getElementById('caja-reloj');
        const displayReloj = document.getElementById('timer-display');
        const nombreBailando = document.getElementById('nombre-bailando');
        const barraMeta = document.getElementById('barra-meta');
        const txtPuntos = document.getElementById('puntos-actuales');
        const txtMeta = document.getElementById('meta-total');
        const cajaTransicion = document.getElementById('caja-transicion');
        const textoTransicion = document.getElementById('texto-transicion');
        const countdownTransicion = document.getElementById('countdown-transicion');

        function resolverRutaAvatar(src) {
            if (!src) return '';
            if (src.startsWith('/') || src.startsWith('http') || src.startsWith('data:')) return src;
            return '/regalos/' + src;
        }

        fetch('/api/queens/all').then(r => r.json()).then(all => {
            all.forEach(q => {
                QUEEN_COLORS[q.name] = q.color;
                QUEEN_AVATARS[q.name] = q.avatar_img || q.regalo_img || '';
            });
        });
        fetch('/api/apodos').then(r => r.json()).then(map => { APODOS = map; });

        socket.on('queensActualizadas', (data) => {
            if (data.equipos) {
                Object.keys(data.equipos).forEach(n => {
                    QUEEN_COLORS[n] = data.equipos[n].color;
                    QUEEN_AVATARS[n] = data.equipos[n].avatar_img || data.equipos[n].regalo_img || '';
                });
            }
            if (data.apodos) APODOS = data.apodos;
        });

        function lighten(hex) {
            try {
                let r = Math.min(255, parseInt(hex.slice(1,3),16)+60);
                let g = Math.min(255, parseInt(hex.slice(3,5),16)+60);
                let b = Math.min(255, parseInt(hex.slice(5,7),16)+60);
                return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
            } catch(e) { return hex; }
        }

        function formatearTiempo(segundos) {
            let m = Math.floor(segundos / 60).toString().padStart(2, '0');
            let s = (segundos % 60).toString().padStart(2, '0');
            return m + ':' + s;
        }

        function aplicarColoresChica(chica) {
            const color = QUEEN_COLORS[chica] || '#00ffff';
            const light = lighten(color);
            const apodo = APODOS[chica] || chica;
            nombreBailando.innerText = apodo;
            nombreBailando.style.color = color;
            cajaReloj.style.borderColor = color;
            cajaReloj.style.boxShadow = `0 0 35px ${color}`;
            cajaTransicion.style.borderColor = color;
            cajaTransicion.style.boxShadow = `0 0 35px ${color}`;
            barraMeta.style.background = `linear-gradient(90deg, ${color}, ${light})`;
            const brilloReloj = `drop-shadow(0 0 8px ${color}) drop-shadow(0 0 18px ${color}) drop-shadow(0 0 32px ${color}) drop-shadow(3px 4px 0px #2A003E)`;
            displayReloj.style.filter = brilloReloj;
            countdownTransicion.style.filter = brilloReloj;

            // Actualizar Avatar y Marco
            const avatarRaw = QUEEN_AVATARS[chica] || '';
            const avatarUrl = resolverRutaAvatar(avatarRaw);
            const initial = (apodo || chica || 'Q').charAt(0).toUpperCase();

            ['reloj', 'transicion'].forEach(key => {
                const imgEl = document.getElementById(`avatar-img-${key}`);
                const fallbackEl = document.getElementById(`avatar-fallback-${key}`);
                const marcoEl = document.getElementById(`marco-${key}`);

                if (fallbackEl) fallbackEl.innerText = initial;

                if (marcoEl) {
                    marcoEl.style.filter = `drop-shadow(0 0 12px ${color})`;
                }

                if (imgEl) {
                    if (avatarUrl) {
                        imgEl.src = avatarUrl;
                    } else {
                        imgEl.style.display = 'none';
                        if (fallbackEl) fallbackEl.style.display = 'flex';
                    }
                }
            });
        }

        socket.on('conociendoInicio', (data) => {
            cajaTransicion.style.display = 'none';
            cajaReloj.style.display = 'flex';
            contenedor.classList.add('timer-activo');
            const txtTitulo = document.getElementById('texto-titulo-dinamica');
            if (txtTitulo) {
                if (data.titulo !== undefined) {
                    const t = (data.titulo || '').trim();
                    txtTitulo.innerText = t ? t + ' ' : '';
                }
            }
            if (data.chica) {
                if (data.avatar_img) QUEEN_AVATARS[data.chica] = data.avatar_img;
                aplicarColoresChica(data.chica);
            }
            displayReloj.innerText = formatearTiempo(data.tiempo);
            txtMeta.innerText = data.meta;
            actualizarBarra(data.puntos, data.meta);
        });

        socket.on('conociendoTick', (tiempo) => { displayReloj.innerText = formatearTiempo(tiempo); });

        socket.on('conociendoPuntos', (data) => { actualizarBarra(data.puntos, data.meta); });

        socket.on('conociendoTransicion', (data) => {
            cajaReloj.style.display = 'none';
            cajaTransicion.style.display = 'flex';
            contenedor.classList.add('timer-activo');
            const col = QUEEN_COLORS[data.chica] || '#00ffff';
            textoTransicion.innerHTML = '¡SIGUIENTE: <span style="color:' + col + '">' + data.chica + '</span>!';
            countdownTransicion.innerText = data.tiempo;
            aplicarColoresChica(data.chica); 
        });

        socket.on('conociendoTransicionTick', (tiempo) => { countdownTransicion.innerText = tiempo; });
        
        socket.on('conociendoCancelado', () => { 
            contenedor.classList.remove('timer-activo'); 
            cajaReloj.style.display = 'none';
            cajaTransicion.style.display = 'none';
        });

        function actualizarBarra(puntos, meta) {
            txtPuntos.innerText = puntos;
            let porcentaje = meta === 0 ? 0 : (puntos / meta) * 100;
            if(porcentaje > 100) porcentaje = 100;
            barraMeta.style.width = porcentaje + '%';
        }

        // ── BRAND MANAGER LOGIC ──
        function loadGoogleFont(fontName) {
            if (!fontName) return;
            const fontId = 'custom-google-font';
            let link = document.getElementById(fontId);
            if (!link) {
                link = document.createElement('link');
                link.id = fontId;
                link.rel = 'stylesheet';
                document.head.appendChild(link);
            }
            link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(fontName)}:wght@400;700;800;900&display=swap`;
            document.body.style.fontFamily = `'${fontName}', sans-serif`;
        }

        function aplicarMarca(config) {
            if (!config) return;
            // Tipografía
            if (config.fontFamily) {
                loadGoogleFont(config.fontFamily);
            }
            // Logotipo
            const logoContainer = document.getElementById('agency-logo-container');
            const logoImg = document.getElementById('agency-logo');
            if (logoContainer && logoImg) {
                if (config.logoUrl) {
                    logoImg.src = config.logoUrl;
                    logoContainer.style.opacity = '1';
                    logoContainer.style.transform = 'scale(1)';
                } else {
                    logoContainer.style.opacity = '0';
                    logoContainer.style.transform = 'scale(0.8)';
                }
            }
            // Brillo neón
            document.body.classList.remove('neon-none', 'neon-low', 'neon-high');
            if (config.neonIntensity && config.neonIntensity !== 'normal') {
                document.body.classList.add('neon-' + config.neonIntensity);
            }
        }

        socket.on('marcaCambiado', aplicarMarca);
        </script>

    <!-- Logotipo de la Agencia Flotante -->
    <div id="agency-logo-container" style="position: absolute; top: 20px; right: 20px; z-index: 9999; pointer-events: none; transition: all 0.5s ease; opacity: 0; transform: scale(0.8);">
        <img id="agency-logo" src="" style="max-height: 80px; max-width: 150px; object-fit: contain; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));">
    </div>
</body>
</html>
